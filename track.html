<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track — VECCTAPIVOT GLOBAL</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:820px;margin:18px auto;padding:0 14px}
.top-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0005}
.h{color:#facc15;text-align:center;margin:0;font-size:24px}
.sub{color:#94a3b8;text-align:center;font-size:12px;margin:6px 0 14px}
.search{display:flex;gap:8px}
.input{flex:1;padding:14px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box;outline:none}
.input:focus{border-color:#facc15;box-shadow:0 0 0 3px #facc1526}
.btn-gold{padding:14px 18px;border:none;border-radius:12px;background:#facc15;color:#000;font-weight:900;cursor:pointer}
.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:16px;margin:12px 0}
.well{padding:14px;border-radius:14px;margin:10px 0;border:2px solid;line-height:1.6;font-size:14px}
.green{border-color:#22c55e;background:#052e16}.red{border-color:#ef4444;background:#450a0a}.yellow{border-color:#facc15;background:#422006}.blue{border-color:#60a5fa;background:#0c1a32}.gray{border-color:#334155;background:#0f172a}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.6px}
.b-Logged{background:#334155;color:#fff}.b-Quoted{background:#422006;color:#facc15}.b-Paid{background:#052e16;color:#22c55e}.b-InProgress{background:#1e1b4b;color:#a5b4fc}.b-Done{background:#052e16;color:#22c55e}.b-Revision{background:#450a0a;color:#fca5a5}.b-Resubmitted{background:#422006;color:#fdba74}.b-LDY{background:#422006;color:#facc15;border:1px solid #facc15}
.timeline{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.step{min-width:110px;text-align:center;padding:10px;border-radius:12px;border:1px solid #334155;background:#0f172a;opacity:.5;font-size:12px}
.step.active{opacity:1;border-color:#facc15;background:#422006;color:#facc15;font-weight:800}
.kbd{font-family:ui-monospace;font-size:22px;color:#facc15;font-weight:900}
.small{font-size:11px;color:#94a3b8}
.textarea{width:100%;padding:12px;border-radius:10px;background:#0f172a;border:1px solid #334155;color:#fff;box-sizing:border-box;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
</style>
</head><body>
<div class="utility"><div class="uwrap"><span class="uitem"><span class="ubadge">TRACK GLOBAL LIVE</span></span><span class="uitem">JOB + TIC + LDY LAUNDRY</span><a class="uitem" href="https://wa.me/254788099685">Help</a></div></div>
<header class="top"><div class="navrow"><a class="brand" href="index.html"><img src="logo.png"><span class="brandname">Vecctapivot<em>Track Desk</em></span></a><div class="navcta"><a class="btn line sm2" href="job.html">New Job</a><a class="btn gold sm2" href="ticket.html">Raise Ticket</a></div></div></header>

<main class="wrap">
<div class="top-card">
<h2 class="h">Track Job, Ticket & Laundry — GLOBAL</h2>
<p class="sub">Enter JOB-xxxxxx or TIC-xxxxx or LDY-xxxxx — see status + pay</p>
<div class="search"><input id="q" class="input" placeholder="JOB-123456 or TIC-12345 or LDY-12345"><button class="btn-gold" onclick="doTrack()">TRACK →</button></div>
<div id="cloudSt" class="small" style="text-align:center;margin-top:8px;color:#22c55e">● Cloud: vecctapivot — JOB TIC LDY live | Till 1741514</div>
</div>

<div id="out"></div>
</main>

<script type="module">
import { db } from './firebase.js';
import { collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TILL = 1741514;
window.currentLaundry = null;

async function findById(col, id){ try{ let snap=await getDocs(query(collection(db,col), where('id','==',id))); let r=null; snap.forEach(d=>{r={...d.data(),_docId:d.id}}); return r; }catch(e){ return null; } }

function timeline(status){
 let steps=['Logged','Quoted','Paid','In Progress','Done']; let idx=steps.indexOf(status); if(status==='Revision Needed') idx=1; if(status==='Resubmitted') idx=1;
 return `<div class=timeline>${steps.map((s,i)=>`<div class="step ${i<=idx?'active':''}">${i<=idx?'✅':'○'} ${s}</div>`).join('')}</div>`;
}
function laundryTimeline(steps){
  if(!steps) return '';
  return `<div class=timeline>${steps.map(s=>`<div class="step ${s.status==='done'?'active':''}">${s.status==='done'?'✅':'○'} ${s.name}<br><span class=small>${s.time||''}</span></div>`).join('')}</div>`;
}

window.doTrack=async()=>{
 let id=(q.value||new URLSearchParams(location.search).get('job')||new URLSearchParams(location.search).get('ticket')||new URLSearchParams(location.search).get('laundry')||'').toUpperCase().trim();
 if(!id){alert('Enter JOB- or TIC- or LDY- ID'); return}
 q.value=id;
 document.getElementById('out').innerHTML='<div class=card>⏳ Checking cloud + local...</div>';
 
 if(id.startsWith('JOB')){
  let j=await findById('jobs', id);
  if(!j){document.getElementById('out').innerHTML=`<div class="card" style="border-left:5px solid #ef4444"><b style="color:#ef4444">JOB ${id} not found</b></div>`; return}
  let h=`<div class=card>
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><span class=kbd>${j.id}</span><br><span class="badge b-${(j.status||'Logged').replace(' ','')}">${j.status}</span> <span class=small>${j.logged||''}</span></div>
  <div style="text-align:right"><div class=small>Price</div><div style="font-size:22px;font-weight:900;color:#facc15">${j.price?'KSH '+j.price:'Awaiting quote'}</div></div></div>
  ${timeline(j.status)}</div>`;
  if(j.adminMessage) h+=`<div class="well green"><b style="color:#22c55e">✅ ADMIN:</b><br>${j.adminMessage}</div>`;
  document.getElementById('out').innerHTML=h;
 }
 else if(id.startsWith('TIC')){
  let t=await findById('tickets', id);
  if(!t){document.getElementById('out').innerHTML=`<div class=card>TICKET ${id} not found</div>`; return}
  let h=`<div class=card><span class=kbd style="color:#60a5fa">${t.id}</span> for <b style="color:#facc15">${t.jobId}</b><br>${t.subject}</div>`;
  if(t.adminReply) h+=`<div class="well green"><b>✅ ADMIN REPLY:</b><br>${t.adminReply}</div>`;
  document.getElementById('out').innerHTML=h;
 }
 else if(id.startsWith('LDY')){
  let localData = JSON.parse(localStorage.getItem('order_' + id) || 'null');
  let cloudData = await findById('laundry', id);
  let l = cloudData || localData;
  if(!l){document.getElementById('out').innerHTML=`<div class=card style="border-left:5px solid #ef4444"><b style="color:#ef4444">Laundry ${id} not found</b></div>`; return}
  window.currentLaundry = l;
  window.currentLaundryTotal = (l.total+'').replace(/[^0-9]/g,'')||l.total;

  let curStep = l.steps ? [...l.steps].reverse().find(s=>s.status==='done')?.name : (l.status||'Received');
  let isPaid = !!l.paid;
  let isDispatched = (l.status==='Dispatched' || curStep==='Dispatched');
  let isDelivered = (l.status==='Delivered');

  let h=`<div class=card>
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <div><span class=kbd style="color:#facc15">${l.ticket||l.id}</span><br><span class="badge b-LDY">LAUNDRY ${isPaid?'✅ PAID':'❌ NOT PAID'}</span> <span class=small>${l.createdAt||''}</span></div>
    <div style="text-align:right"><div class=small>Total</div><div style="font-size:22px;font-weight:900;color:#facc15">KES ${l.total}</div><div class=small>${l.location||''} • ${l.name||''}</div></div>
  </div>
  ${laundryTimeline(l.steps)}
  </div>`;

  // LOCK LOGIC
  if((curStep==='Ready' || l.status==='Ready') && !isPaid){
    h+=`<div class="well yellow" style="border-color:#facc15">
      <b style="color:#facc15;font-size:16px">🧺 READY — PLEASE PAY TO UNLOCK 🔒</b><br>
      <div style="margin-top:8px;font-size:18px">Amount: <b style="color:#facc15">KES ${l.total}</b><br>Till: <b>${TILL} — VECCTA Buy Goods</b></div>
      <button class="btn" style="background:#facc15;color:#000;margin-top:12px" onclick="promptPay()">💚 PAY NOW — KES ${l.total} — TILL ${TILL}</button>
      <div class="small" style="margin-top:8px">1. Click PAY 2. M-Pesa Buy Goods 3. Till ${TILL} Amount ${l.total} 4. Enter PIN<br>Goods remain 🔒 LOCKED at store until admin dispatches.</div>
      <div style="margin-top:12px"><input id="mpesaCode" class="input" placeholder="Enter M-Pesa Code e.g QGH7... after paying"><button class="btn" style="background:#0f172a;border:1px solid #facc15;color:#facc15;margin-top:6px" onclick="submitCode('${l._docId||l.ticket}')">Confirm Code →</button></div>
    </div>`;
  } else if(isPaid && !isDispatched && !isDelivered){
    h+=`<div class="well green"><b style="color:#22c55e">✅ Payment Received — KES ${l.total}</b><br><span class=small>Goods still 🔒 LOCKED at store. Awaiting Admin Dispatch. Rider will get goods after dispatch.</span></div>`;
  } else if(isDispatched){
    h+=`<div class="well blue"><b style="color:#60a5fa">🚚 DISPATCHED — Rider has your laundry 🔓</b><br><span class=small>Goods unlocked. On the way to ${l.location||'you'}</span><br>
    <button class="btn" style="background:#22c55e;color:#000;margin-top:12px" onclick="markReceived('${l._docId||l.ticket}')">✅ I HAVE RECEIVED MY LAUNDRY</button></div>`;
  } else if(isDelivered){
    h+=`<div class="well green"><b style="color:#22c55e">✅ DELIVERED</b><br>${l.rating?`⭐ ${l.rating}/5 — ${l.comment||''}`:'Thank you!'}</div>`;
  } else {
    h+=`<div class="well gray"><span class=small>Current: ${curStep} — washing in progress.</span></div>`;
  }

  h+=`<div class=card style="display:flex;gap:8px;flex-wrap:wrap"><a href="https://wa.me/254788099685?text=Hi%20about%20Laundry%20${l.ticket||l.id}%20Till%20${TILL}" style="flex:1;background:#22c55e;color:#000;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800">WhatsApp Laundry</a><a href="laundry.html" style="flex:1;background:#0f172a;border:1px solid #334155;color:#fff;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:700">New Booking →</a></div>`;

  document.getElementById('out').innerHTML=h;
 }
}

window.promptPay=()=>{
  let total = (window.currentLaundryTotal+'').replace(/[^0-9]/g,'');
  alert(`M-PESA BUY GOODS\nTill Number: ${TILL}\nAmount: KES ${total}\n\n1. M-Pesa → Buy Goods & Services\n2. Till: ${TILL}\n3. Amount: ${total}\n4. Enter PIN to Pay`);
}

window.submitCode=async(docId)=>{
  let code = document.getElementById('mpesaCode')?.value.trim().toUpperCase();
  if(!code){alert('Enter M-Pesa Code'); return}
  try{ await updateDoc(doc(db,'laundry',docId),{ mpesaCode: code }); alert('✅ Code saved. Admin will verify Till 1741514 and dispatch.'); } catch(e){ localStorage.setItem('mpesa_'+docId, code); alert('✅ Code saved locally. Admin will see on same device.'); }
}

window.markReceived=async(docId)=>{
  let rating = prompt('Rate us 1-5:'); if(!rating) return;
  let comment = prompt('Comment for admin:')||'';
  try{
    await updateDoc(doc(db,'laundry',docId),{ status:'Delivered', rating:parseInt(rating), comment:comment, receivedAt:new Date().toISOString() });
    alert('✅ Thank you! Delivered + Rated.');
    doTrack();
  }catch(e){ alert('Error saving rating, check cloud rules.'); }
}

window.resubmitJob=async(docId)=>{
 let v=document.getElementById('rep')?.value?.trim(); if(!v){alert('Write your reply'); return}
 await updateDoc(doc(db,'jobs',docId),{revisionReply:v,status:'Resubmitted'});
 alert('✅ Resubmitted'); doTrack();
}
window.onload=()=>{
 let p=new URLSearchParams(location.search); let j=p.get('job'), t=p.get('ticket'), l=p.get('laundry')||p.get('ldy'); if(j||t||l){q.value=(j||t||l).toUpperCase(); doTrack()}
}
</script>
</body></html>
