<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track — VECCTAPIVOT GLOBAL Till 1741514</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
.wrap{max-width:820px;margin:18px auto;padding:0 14px}
.top-card{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:22px;padding:22px}
.h{color:#facc15;text-align:center;margin:0;font-size:24px}.sub{color:#94a3b8;text-align:center;font-size:12px;margin:6px 0 14px}
.search{display:flex;gap:8px}.input{flex:1;padding:14px;border-radius:12px;background:#0f172a;color:#fff;border:1px solid #334155;box-sizing:border-box;outline:none}
.btn-gold{padding:14px 18px;border:none;border-radius:12px;background:#facc15;color:#000;font-weight:900;cursor:pointer}
.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:16px;margin:12px 0}.well{padding:14px;border-radius:14px;margin:10px 0;border:2px solid;line-height:1.6;font-size:14px}
.green{border-color:#22c55e;background:#052e16}.yellow{border-color:#facc15;background:#422006}.blue{border-color:#60a5fa;background:#0c1a32}.gray{border-color:#334155;background:#0f172a}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;background:#422006;color:#facc15;border:1px solid #facc15}
.timeline{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.step{min-width:110px;text-align:center;padding:10px;border-radius:12px;border:1px solid #334155;background:#0f172a;opacity:.5;font-size:12px}.step.active{opacity:1;border-color:#facc15;background:#422006;color:#facc15;font-weight:800}
.kbd{font-family:ui-monospace;font-size:22px;color:#facc15;font-weight:900}.small{font-size:11px;color:#94a3b8}.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
</style></head><body>
<div class="utility"><div class="uwrap"><span class="uitem"><span class="ubadge">TRACK LIVE — ALL</span></span><span class="uitem">LDY | JOB | TIC | Till 1741514</span><a class="uitem" href="https://wa.me/254788099685">Help</a></div></div>
<header class="top"><div class="navrow"><a class="brand" href="index.html"><img src="logo.png"><span class="brandname">Vecctapivot<em>Track</em></span></a><div class="navcta"><a class="btn line sm2" href="laundry.html">New Booking</a><a class="btn gold sm2" href="request-job.html">Request Job</a></div></div></header>
<main class="wrap">
<div class="top-card"><h2 class="h">Track — Till 1741514</h2><p class="sub">LDY / JOB / TIC — LIVE + Receipt</p><div class="search"><input id="q" class="input" placeholder="LDY-66139 or JOB- or TIC-"><button class="btn-gold" onclick="doTrack()">TRACK →</button></div><div id="cloudSt" class="small" style="text-align:center;margin-top:8px;color:#22c55e">● LIVE</div></div>
<div id="out"></div><div id="rateBox"></div>
</main>
<script type="module">
import { db } from './firebase.js';
import { collection, query, where, getDocs, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const TILL=1741514;
window.currentLaundry=null; let unsub=null;
function genUniqueReceipt(){ let d=new Date(); let date=d.toISOString().slice(0,10).replace(/-/g,''); let rand=Math.floor(1000+Math.random()*9000); return `RCP-${date}-${rand}`; }
function laundryTimeline(l){
  let order=["Received","Washing","Ironing / Pressing","Ready for Pickup","Delivered"];
  let cur=l.status||'Received'; if(l.status==='Dispatched') cur='Ready for Pickup';
  let idx=order.indexOf(cur);
  return `<div class=timeline>${order.map((name,i)=>`<div class="step ${i<=idx?'active':''}">${i<=idx?'✅':'○'} ${name}</div>`).join('')}</div>`;
}
function jobTimeline(j){ let steps=j.steps||[{name:"Logged",status:"done"},{name:"Quoted",status:j.price?"done":"pending"},{name:"Paid",status:j.status==='Paid'||j.status==='Done'?"done":"pending"},{name:"In Progress",status:j.status==='In Progress'||j.status==='Done'?"done":"pending"},{name:"Done",status:j.status==='Done'?"done":"pending"}]; return `<div class=timeline>${steps.map(s=>`<div class="step ${s.status==='done'?'active':''}">${s.status==='done'?'✅':'○'} ${s.name}</div>`).join('')}</div>`; }
function ticTimeline(t){ let steps=t.steps||[{name:"Open",status:"done"},{name:"In Progress",status:t.status==='In Progress'||t.status==='Closed'?"done":"pending"},{name:"Admin Reply",status:t.adminReply?"done":"pending"},{name:"Closed",status:t.status==='Closed'?"done":"pending"}]; return `<div class=timeline>${steps.map(s=>`<div class="step ${s.status==='done'?'active':''}">${s.status==='done'?'✅':'○'} ${s.name}</div>`).join('')}</div>`; }

function renderLaundry(l){
 window.currentLaundry=l;
 let isPaid = l.paid || (l.paymentStatus&&l.paymentStatus.includes('PAID'));
 let isVerifying = l.paymentStatus==='VERIFYING';
 let isReady = l.status==='Ready for Pickup' || l.status==='Dispatched' || l.status==='Delivered';
 let isDispatched = l.status==='Dispatched';
 let isDelivered = l.status==='Delivered';
 let h=`<div class=card><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><span class=kbd>${l.ticket||l.id}</span><br><span class=badge>🧺 LAUNDRY • ${l.status||'Received'} • ${isPaid?'PAID Till '+TILL:'NOT PAID'}</span><br><span class=small>Receipt: <b style="color:#facc15">${l.receiptNo||'Pending'}</b></span></div><div style="text-align:right"><div class=small>Total</div><div style="font-size:22px;font-weight:900;color:#facc15">KES ${l.total||0}</div></div></div>${laundryTimeline(l)}</div>`;
 if(isReady &&!isPaid &&!isVerifying){
   h+=`<div class="well yellow"><b>🧺 Ready — Please Pay Till ${TILL}</b><br>KES ${l.total}<br><input id="mpesaCode" class="input" style="margin-top:8px" placeholder="M-Pesa Code"><button class="btn" style="background:#facc15;color:#000;margin-top:8px" onclick="submitCode('${l._docId}')">Paid — Verify</button></div>`;
 }
 if(isVerifying){
   h+=`<div class="well yellow"><b>⏳ Payment Received — Verification in Progress</b><br>Code: ${l.mpesaCode}</div>`;
 }
 if(isPaid && isReady &&!isDispatched &&!isDelivered){
   h+=`<div class="well green"><b>✅ Payment Confirmed — ${l.mpesaCode||''} Till ${TILL}</b><br>🧾 Receipt in process — Goods LOCKED — Awaiting dispatch</div><div class=card><button class="btn" style="background:#22c55e;color:#000" onclick="chooseNow('${l._docId}')">Ready NOW — Dispatch Now</button><div style="margin:12px 0;text-align:center;color:#94a3b8">— or schedule —</div><input id="sDate" type="date" class="input"><input id="sTime" type="time" class="input" style="margin-top:6px"><input id="sPlace" class="input" placeholder="Place e.g Kikopey" style="margin-top:6px"><button class="btn" style="background:#0f172a;border:1px solid #facc15;color:#facc15;margin-top:8px" onclick="chooseSchedule('${l._docId}')">Schedule — Send Time + Place</button>${l.deliveryDate?`<div class="well yellow" style="margin-top:10px">📅 Scheduled: ${l.deliveryDate} ${l.deliveryTime||''} at ${l.deliveryPlace||''} ${l.scheduleNoted?'<br><b style="color:#22c55e">✓ Admin Noted — Rider coming</b>':'<br>⏳ Waiting Admin Noted'}</div>`:''}</div>`;
 }
 if(isDispatched){
   h+=`<div class="well blue"><b>🚚 DISPATCHED — Rider has laundry</b><br><div style="background:#0f172a;padding:10px;border-radius:10px;margin-top:8px;line-height:1.8">Reg: ${l.ticket}<br><b style="color:#facc15">Receipt No (UNIQUE): ${l.receiptNo}</b><br>Rider: ${l.riderName||'-'}<br>Tel: ${l.riderTel||'-'}<br>Plate: ${l.riderPlate||'-'}<br>Close: ${l.closeTime||''}<br>Sign: ${l.signature||''}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="background:#facc15;color:#000;flex:1" onclick="generateReceipt()">📄 Download Receipt</button><button class="btn" style="background:#0f172a;border:1px solid #facc15;color:#facc15;flex:1" onclick="shareReceipt()">Share</button></div><button class="btn" style="background:#22c55e;color:#000;margin-top:12px" onclick="customerReceived('${l._docId}')">✅ I Have Received</button></div>`;
 }
 if(isDelivered){
   h+=`<div class="well green"><b>✅ DELIVERED</b><br>Reg ${l.ticket} | RCP ${l.receiptNo||''}<br>${l.rating?`<b style="color:#facc15">${'★'.repeat(l.rating)} ${l.rating}/5</b> ${l.comment||''}`:''}<br><button class="btn" style="background:#facc15;color:#000;margin-top:8px" onclick="generateReceipt()">📄 Receipt Again</button></div>`;
   if(!l.rating) setTimeout(()=>markReceived(l._docId,'laundry'),300);
 }
 h+=`<div class=card><a href="https://wa.me/254788099685?text=Hi%20about%20${l.ticket||l.id}%20RCP%20${l.receiptNo||''}" style="background:#22c55e;color:#000;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-weight:800;display:block">WhatsApp Support</a></div>`;
 document.getElementById('out').innerHTML=h;
}
function renderJob(j){ window.currentLaundry=j; let h=`<div class=card><span class=kbd>${j.id||j.ticket}</span><br><span class=badge>💼 JOB • ${j.status||'Logged'}</span><br><span class=small>${j.fullService||j.title||''}</span>${jobTimeline(j)}</div><div class="well blue"><b>💼 JOB</b><br>Client: ${j.clientName||j.name||''}<br>Price: ${j.price? 'KSH '+j.price:'Pending'}<br>Status: ${j.status||''}<br>${j.adminMessage?`<div style="background:#052e16;border:1px solid #22c55e;padding:8px;border-radius:8px;margin-top:6px">💬 ${j.adminMessage}</div>`:''}</div>`; if(j.status!=='Done') h+=`<button class="btn" style="background:#facc15;color:#000" onclick="markReceived('${j._docId}','jobs')">✅ Mark Done & Rate ⭐</button>`; if(j.rating) h+=`<div class="well green"><b style="color:#facc15">${'★'.repeat(j.rating)} ${j.rating}/5</b> — ${j.comment||''}</div>`; document.getElementById('out').innerHTML=h; }
function renderTic(t){ window.currentLaundry=t; let h=`<div class=card><span class=kbd>${t.id||t.ticket}</span><br><span class=badge>🎫 TIC • ${t.status||'Open'}</span>${ticTimeline(t)}</div><div class="well gray"><b>🎫 Ticket</b><br>${t.message||''}<br>Status: ${t.status||''}<br>${t.adminReply?`<div style="background:#052e16;padding:8px;border-radius:8px;margin-top:6px;color:#22c55e">Admin: ${t.adminReply}</div>`:''}</div>`; if(t.status!=='Closed') h+=`<button class="btn" style="background:#facc15;color:#000" onclick="markReceived('${t._docId}','tickets')">✅ Resolve & Rate ⭐</button>`; document.getElementById('out').innerHTML=h; }

window.doTrack=async()=>{
 let id=(q.value||new URLSearchParams(location.search).get('laundry')||new URLSearchParams(location.search).get('ldy')||new URLSearchParams(location.search).get('job')||new URLSearchParams(location.search).get('ticket')||new URLSearchParams(location.search).get('id')||'').toUpperCase().trim(); if(!id){alert('Enter LDY- / JOB- / TIC-');return}
 q.value=id; document.getElementById('out').innerHTML='<div class=card>⏳ Checking '+id+'...</div>'; if(unsub){unsub();unsub=null;}
 let cols=id.startsWith('JOB')?['jobs','tickets','laundry']:id.startsWith('TIC')?['tickets','jobs','laundry']:['laundry','jobs','tickets']; let idx=0;
 async function tryNextCol(){ if(idx>=cols.length){ document.getElementById('out').innerHTML=`<div class=card style="border-color:#ef4444;background:#450a0a">❌ ${id} not found</div>`; return; } let col=cols[idx++]; try{ let qs=await getDocs(query(collection(db,col), where('id','==',id))); if(!qs.empty){ let first=qs.docs[0]; unsub=onSnapshot(doc(db,col,first.id), snap=>{ let d={...snap.data(),_docId:snap.id,ticket:snap.data().ticket||id}; if(col==='laundry') renderLaundry(d); else if(col==='jobs') renderJob(d); else renderTic(d); }); return; } let qs2=await getDocs(query(collection(db,col), where('ticket','==',id))); if(!qs2.empty){ let first=qs2.docs[0]; unsub=onSnapshot(doc(db,col,first.id), snap=>{ let d={...snap.data(),_docId:snap.id,ticket:snap.data().ticket||id}; if(col==='laundry') renderLaundry(d); else if(col==='jobs') renderJob(d); else renderTic(d); }); return; } onSnapshot(doc(db,col,id), snap=>{ if(!snap.exists()){ tryNextCol(); return; } let d={...snap.data(),_docId:snap.id,ticket:snap.data().ticket||id}; if(col==='laundry') renderLaundry(d); else if(col==='jobs') renderJob(d); else renderTic(d); }, err=>{ tryNextCol(); }); }catch(e){ tryNextCol(); } } tryNextCol();
}
window.submitCode=async(docId)=>{ let code=document.getElementById('mpesaCode')?.value.trim().toUpperCase(); if(!code)return alert('Enter code'); await updateDoc(doc(db,'laundry',docId),{ mpesaCode:code, paymentStatus:'VERIFYING', paid:false }); }
window.chooseNow=async(docId)=>{ await updateDoc(doc(db,'laundry',docId),{ deliveryChoice:'NOW', deliveryDate:'NOW', deliveryTime:'Now', deliveryPlace:'Now' }); alert('NOW requested'); }
window.chooseSchedule=async(docId)=>{ let d=document.getElementById('sDate').value, t=document.getElementById('sTime').value, p=document.getElementById('sPlace').value; if(!d||!p) return alert('Date and Place required'); await updateDoc(doc(db,'laundry',docId),{ deliveryDate:d, deliveryTime:t, deliveryPlace:p, deliveryChoice:'SCHEDULE', scheduleNoted:false }); alert('Scheduled '+d+' '+t+' at '+p); }
window.customerReceived=async(docId)=>{ await updateDoc(doc(db,'laundry',docId),{ customerReceived:true, customerReceivedAt:new Date().toLocaleString() }); }
window.generateReceipt=async()=>{ let l=window.currentLaundry; if(!l.receiptNo){ let r=genUniqueReceipt(); l.receiptNo=r; try{ await updateDoc(doc(db,'laundry',l._docId),{ receiptNo:r }); }catch(e){} } const { jsPDF }=window.jspdf; const docu=new jsPDF(); docu.setFillColor(15,23,42); docu.rect(0,0,210,35,'F'); docu.setTextColor(250,204,21); docu.setFontSize(16); docu.setFont('helvetica','bold'); docu.text('VECCTAPIVOT LAUNDRY SERVICES',10,14); docu.setFontSize(9); docu.setTextColor(148,163,184); docu.text('Valet • Steam Press • Till 1741514',10,22); docu.setTextColor(0,0,0); docu.setFontSize(12); docu.setFont('helvetica','bold'); docu.text(`Reg: ${l.ticket||l.id}`,10,42); docu.text(`Receipt No (UNIQUE): ${l.receiptNo}`,10,50); docu.setFont('helvetica','normal'); docu.setFontSize(10); let y=60; docu.text(`Customer: ${l.name||''} Phone: ${l.phone||''}`,10,y); y+=6; docu.text(`Total KES ${l.total} Till ${TILL} Code ${l.mpesaCode||''}`,10,y); y+=6; docu.text(`Rider ${l.riderName||''} Tel ${l.riderTel||''} Plate ${l.riderPlate||''}`,10,y); y+=6; docu.text(`Sign ${l.signature||''} Close ${l.closeTime||''}`,10,y); docu.save(`${l.receiptNo}_Receipt.pdf`); }
window.shareReceipt=()=>{ let l=window.currentLaundry; let txt=`*VECCTAPIVOT*%0AReg ${l.ticket}%0ARCP ${l.receiptNo}%0AKES ${l.total} Till ${TILL}%0ARider ${l.riderName} ${l.riderTel}`; window.open('https://wa.me/?text='+txt,'_blank'); }
window.markReceived=async(docId,colName)=>{
 document.getElementById('rateBox').innerHTML=`<div class="card" style="border-color:#facc15;text-align:center"><b style="color:#facc15">⭐ Rate — Tap a star</b><div style="font-size:46px;margin:12px 0" id="starRow"><span onclick="setStars(1)">☆</span><span onclick="setStars(2)">☆</span><span onclick="setStars(3)">☆</span><span onclick="setStars(4)">☆</span><span onclick="setStars(5)">☆</span></div><div id="starText" class=small>Tap to rate</div><input id="rateComment" class="input" placeholder="Comment" style="margin-top:10px"><button class="btn" style="background:#facc15;color:#000;margin-top:10px" onclick="submitRating('${docId}','${colName}')">Submit ⭐</button></div>`;
 let rating=0; window.setStars=(n)=>{ rating=n; let row=document.getElementById('starRow'); row.dataset.rating=n; let spans=row.querySelectorAll('span'); spans.forEach((s,i)=>{ s.innerText=i<n?'★':'☆'; s.style.color=i<n?'#facc15':'#555'; }); document.getElementById('starText').innerText=n===1?'1 — Poor':n===2?'2 — Fair':n===3?'3 — Good':n===4?'4 — Very Good':'5 — Excellent!'; };
 window.submitRating=async(id,cName)=>{ let r=document.getElementById('starRow').dataset.rating||rating; let c=document.getElementById('rateComment').value; if(!r){alert('Tap a star');return;} let statusVal = cName==='laundry'?'Delivered':cName==='jobs'?'Done':'Closed'; await updateDoc(doc(db,cName,id),{ rating:parseInt(r), comment:c, status:statusVal, receivedAt:new Date().toISOString() }); alert('Rated '+r+'/5'); document.getElementById('rateBox').innerHTML=''; doTrack(); };
}
window.onload=()=>{ let p=new URLSearchParams(location.search); let t=p.get('ldy')||p.get('job')||p.get('ticket')||p.get('id')||p.get('laundry'); if(t){ q.value=t.toUpperCase(); doTrack(); } }
</script></body></html>
