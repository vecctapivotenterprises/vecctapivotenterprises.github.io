<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry - Gilgil</title>
<style>
:root{--gold:#d4a017;--bg:#111;--card:#1a1a1a;--muted:#888;}
body{background:var(--bg);color:#fff;font-family:Inter,sans-serif;padding:20px;}
.card{background:var(--card);border-radius:16px;padding:20px;max-width:420px;margin:auto;border:1px solid #222;}
label{display:block;margin:12px 0 6px;color:var(--muted);font-size:13px;}
select,input{width:100%;padding:12px;border-radius:10px;background:#222;border:1px solid #333;color:#fff;font-size:15px;}
#autoDeliveryDisplay{margin-top:12px;padding:12px;background:#222;border-left:3px solid var(--gold);border-radius:8px;text-align:center;min-height:48px;}
#autoDeliveryDisplay b{font-size:18px;color:var(--gold);}
#ruleEl{font-size:12px;color:var(--muted);margin-top:4px;}
#totalEl{font-size:28px;font-weight:800;margin-top:10px;color:var(--gold);}
button{width:100%;margin-top:18px;padding:14px;border-radius:12px;background:var(--gold);color:#000;font-weight:800;font-size:16px;border:none;cursor:pointer;}
</style>
</head>
<body>
<div class="card">
  <h2 style="margin:0;">🧺 Laundry Booking</h2>
  
  <label>Service</label>
  <select id="service">
    <option value="150">Wash & Fold - 150 per KG</option>
    <option value="400">Flat - Duvet - 400 flat</option>
    <option value="200">Wash & Iron - 200 per KG</option>
  </select>
  
  <label>Quantity (KG / Items)</label>
  <input type="number" id="qty" value="1" min="1">
  <div id="ruleEl"></div>
  
  <label>Pickup Time</label>
  <select id="pickup">
    <option value="08:00">08:00 AM</option>
    <option value="09:00">09:00 AM</option>
    <option value="10:00">10:00 AM</option>
    <option value="11:00">11:00 AM</option>
    <option value="12:00">12:00 PM</option>
    <option value="13:00">01:00 PM</option>
    <option value="14:00">02:00 PM</option>
    <option value="15:00">03:00 PM</option>
    <option value="16:00">04:00 PM</option>
    <option value="17:00">05:00 PM</option>
    <option value="18:00">06:00 PM</option>
  </select>
  
  <div id="autoDeliveryDisplay">Select pickup time to see delivery</div>
  
  <div id="totalEl">KES 400</div>
  
  <button id="laundSubmitBtn">Book →</button>
</div>

<script>
const serviceEl = document.getElementById('service');
const qtyEl = document.getElementById('qty');
const pickupEl = document.getElementById('pickup');
const totalEl = document.getElementById('totalEl');
const ruleEl = document.getElementById('ruleEl');
const deliveryEl = document.getElementById('autoDeliveryDisplay');

function calc(){
  let rate=parseInt(serviceEl.value);
  let qty=parseInt(qtyEl.value)||1;
  let opt=serviceEl.options[serviceEl.selectedIndex].text;
  let isFlat=opt.toLowerCase().includes('flat');
  let raw=rate*qty;
  let final=isFlat?raw:Math.max(400,raw);
  totalEl.textContent=`KES ${final.toLocaleString()}`;
  ruleEl.textContent=isFlat?`${qty} item(s)`: `${qty}kg x ${rate} = ${raw}`;
  
  let pickHour=parseInt(pickupEl.value.split(':')[0]);
  let deliveryHour=pickHour+4;
  document.getElementById('laundSubmitBtn').textContent=`Book →`;
  
  if(deliveryHour > 18){
    let nextDayHour = 8 + (pickHour - 15);
    if(nextDayHour > 11) nextDayHour = 11;
    let h = String(nextDayHour).padStart(2,'0');
    deliveryEl.innerHTML=`<b style="color:#ff9d66;">${h}:00 AM Tomorrow</b><br><small style="color:#ff9d66;">Extra care overnight, ready ${nextDayHour}AM sharp! ✨</small>`;
    deliveryEl.style.borderLeftColor='#ff9d66';
  } else {
    let ampm = deliveryHour >= 12 ? 'PM' : 'AM';
    let showH = deliveryHour > 12 ? deliveryHour - 12 : deliveryHour;
    let msg = pickHour <= 9 ? 'Fresh, clean & ready today! ✨' : 
              pickHour === 14 ? 'Last same-day slot, ready tonight!' : 
              'Pressed to perfection, ready today!';
    deliveryEl.innerHTML=`<b>${String(showH).padStart(2,'0')}:00 ${ampm}</b><br><small style="color:var(--muted);">${msg}</small>`;
    deliveryEl.style.borderLeftColor='var(--gold)';
  }
  return final;
}

serviceEl.addEventListener('change', calc);
qtyEl.addEventListener('input', calc);
pickupEl.addEventListener('change', calc);
calc();
</script>
</body>
</html>
