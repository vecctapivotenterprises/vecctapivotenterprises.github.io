<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin GLOBAL — VECCTAPIVOT — Full Power Delete</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css">
<style>
:root{--gold:#facc15;--gold2:#eab308;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--bg:#070a14;--card:#1e293b;--line:#334155}
*{box-sizing:border-box}body{background:radial-gradient(1200px 600px at 20% -10%,#1e293b 0%,#0f172a 40%,var(--bg) 100%);color:#fff;font-family:Inter,system-ui;margin:0;min-height:100vh}
.topbar{background:linear-gradient(90deg,#000,#111);border-bottom:2px solid var(--gold);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px}
.page{max-width:1320px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
.s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.s b{font-size:22px;display:block;color:var(--gold)}.s small{color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#0f172a;color:#cbd5e1;font-weight:800;cursor:pointer;font-size:12px;transition:.2s}.tab.active{background:linear-gradient(90deg,var(--gold),#fde047);color:#000;border-color:var(--gold);box-shadow:0 8px 20px #facc1535}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.input,.select,.textarea{padding:11px 12px;border-radius:10px;background:#0f172a;border:1px solid var(--line);color:#fff;box-sizing:border-box;outline:none;transition:.2s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #facc1526}
.card{background:linear-gradient(180deg,rgba(30,41,59,.95),rgba(15,23,42,.9));border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;position:relative;overflow:hidden}
.card:hover{border-color:rgba(250,204,21,.25)}
.well{padding:12px;border-radius:12px;margin:8px 0;border:2px solid;line-height:1.5;font-size:13px}
.g{border-color:var(--green);background:#052e16}.r{border-color:var(--red);background:#450a0a}.y{border-color:var(--gold);background:#422006}.b{border-color:var(--blue);background:#0c1a32}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:12px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;transition:.2s;font-size:12px}.gold{background:linear-gradient(90deg,var(--gold),#fde047);color:#000;box-shadow:0 8px 18px #facc1530}.green{background:var(--green);color:#000}.red{background:var(--red);color:#fff}.line{background:transparent;border:1px solid var(--line);color:#fff}
.btn:hover{transform:translateY(-1px)}.kbd{font-family:ui-monospace;font-weight:900;color:var(--gold)}
.stepBtn{padding:8px 10px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:11px;font-weight:800;cursor:pointer}.stepBtn.done{background:#052e16;border-color:#22c55e;color:#22c55e}
</style>
</head><body>
<div class="topbar">
<div style="display:flex;gap:10px;align-items:center"><img src="logo.png" style="height:28px"><b style="color:var(--gold)">VECCTAPIVOT ADMIN — FULL POWER</b><span id="cloudSt" style="font-size:11px;color:#94a3b8">● Connecting vecctapivot</span></div>
<div style="display:flex;gap:6px"><button class="btn line" onclick="loadCloud()">↻ Cloud</button><button class="btn line" onclick="exportCSV()">CSV</button><a class="btn line" href="index.html" style="text-decoration:none">Home</a></div>
</div>

<div class="page">
<div id="loginBox" class="card" style="max-width:420px;margin:50px auto;text-align:center"><h3 style="color:var(--gold);margin:0 0 8px">Admin Login — Full Power</h3><p style="font-size:11px;color:#94a3b8;margin-bottom:12px">Delete JOB/TICKET/LDY from cloud</p><input id="pw" type="password" class="input" placeholder="veccta2024" style="width:100%"><button class="btn gold" style="width:100%;margin-top:10px;padding:12px" onclick="login()">Login GLOBAL</button></div>

<div id="panel" hidden>
<div class="stats">
<div class="s"><b id="cTotal">0</b><small>Total Jobs</small></div>
<div class="s"><b id="cNew">0</b><small>New Logged</small></div>
<div class="s"><b id="cRev">0</b><small>Revision</small></div>
<div class="s"><b id="cPaid">0</b><small>Paid / Done</small></div>
<div class="s"><b id="cTic">0</b><small>Tickets</small></div>
<div class="s"><b id="cLaund">0</b><small>Laundry LDY</small></div>
<div class="s"><b id="cMoney">0</b><small>KSH Quoted</small></div>
</div>

<div class="tabs">
<span class="tab active" id="tab-jobs" onclick="setTab('jobs')">📦 Jobs</span>
<span class="tab" id="tab-tickets" onclick="setTab('tickets')">🎫 Tickets</span>
<span class="tab" id="tab-laundry" onclick="setTab('laundry')">👕 Laundry LDY</span>
<span class="tab" id="tab-pillars" onclick="setTab('pillars')">🏛 Pillars</span>
</div>

<div class="toolbar">
<input id="q" class="input" placeholder="Search JOB-, TIC-, LDY-, name, phone..." oninput="render()" style="flex:1;min-width:220px">
<select id="fStat" class="select" onchange="render()"><option value="">All Status</option><option>Logged</option><option>Quoted</option><option>Paid</option><option>In Progress</option><option>Done</option><option>Revision Needed</option><option>Resubmitted</option><option>Received</option><option>Ready for Pickup</option><option>Delivered</option></select>
<select id="fPill" class="select" onchange="render()"><option value="">All Pillars</option><option>Digital & Brand Systems</option><option>Academic & Testing Logistics</option><option>Transport Brokerage Hub</option><option>Merchandise Sourcing Links</option><option>Independent Fixer Desk</option><option>General Agency Core</option><option>Statutory & Portal Logistics</option></select>
<select id="fSort" class="select" onchange="render()"><option value="newest">Newest First</option><option value="oldest">Oldest First</option><option value="priceHigh">Price High-Low</option></select>
</div>

<div id="list"></div>
</div>
</div>

<script type="module">
import { db } from './firebase.js';
import { collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let JOBS=[], TICKETS=[], LAUNDRY=[], TAB='jobs';

function getLocal(){
 try{
  let a=JSON.parse(localStorage.getItem('veccta_jobs')||'[]');
  let b=JSON.parse(localStorage.getItem('karanu_jobs')||'[]');
  let m=[...a,...b]; let map=new Map(); m.forEach(j=>{if(!map.has(j.id)) map.set(j.id,j)}); return Array.from(map.values());
 }catch(e){return []}
}

window.login=()=>{if(pw.value==='veccta2024'){loginBox.hidden=true; panel.hidden=false; loadCloud()}else alert('Wrong password')}

window.loadCloud=async()=>{
 cloudSt.textContent='● Syncing cloud...'; cloudSt.style.color='#facc15';
 try{
  let snap=await getDocs(query(collection(db,'jobs'), orderBy('createdAt','desc'), limit(300)));
  let cloud=[]; snap.forEach(d=>{cloud.push({...d.data(),_docId:d.id})});
  let snap2=await getDocs(query(collection(db,'tickets'), orderBy('createdAt','desc'), limit(200)));
  let cloudT=[]; snap2.forEach(d=>{cloudT.push({...d.data(),_docId:d.id})});
  let snap3=await getDocs(query(collection(db,'laundry'), orderBy('createdAt','desc'), limit(200)));
  let cloudL=[]; snap3.forEach(d=>{cloudL.push({...d.data(),_docId:d.id})});
  let local=getLocal(); let map=new Map(); local.forEach(j=>map.set(j.id,j)); cloud.forEach(j=>map.set(j.id,j));
  JOBS=Array.from(map.values()); TICKETS=cloudT; LAUNDRY=cloudL;
  cloudSt.textContent=`● Cloud LIVE — ${cloud.length} jobs / ${cloudT.length} tickets / ${cloudL.length} laundry`; cloudSt.style.color='#22c55e';
 }catch(e){
  cloudSt.textContent='● Local only — '+e.message; cloudSt.style.color='#ef4444';
  JOBS=getLocal(); TICKETS=JSON.parse(localStorage.getItem('veccta_tickets')||'[]');
  // load laundry from localStorage fallback
  LAUNDRY=[]; for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i); if(k.startsWith('order_LDY-')){ try{ LAUNDRY.push(JSON.parse(localStorage.getItem(k))); }catch{} } }
 }
 renderStats(); render();
}

function renderStats(){
 cTotal.textContent=JOBS.length;
 cNew.textContent=JOBS.filter(j=>j.status==='Logged').length;
 cRev.textContent=JOBS.filter(j=>['Revision Needed','Resubmitted'].includes(j.status)).length;
 cPaid.textContent=JOBS.filter(j=>['Paid','Done'].includes(j.status)).length;
 cTic.textContent=TICKETS.length;
 cLaund.textContent=LAUNDRY.length;
 cMoney.textContent='KSH '+(JOBS.reduce((s,j)=>s+(parseInt(j.price)||0),0).toLocaleString());
 document.getElementById('tab-jobs').textContent=`📦 Jobs (${JOBS.length})`;
 document.getElementById('tab-tickets').textContent=`🎫 Tickets (${TICKETS.length})`;
 document.getElementById('tab-laundry').textContent=`👕 Laundry (${LAUNDRY.length})`;
}

window.setTab=t=>{
 TAB=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); render();
}

window.render=()=>{
 let qv=(q.value||'').toLowerCase(), fs=fStat.value, fp=fPill.value, sort=fSort.value;
 let html='';
 if(TAB==='jobs'){
  let list=[...JOBS];
  if(qv) list=list.filter(j=>JSON.stringify(j).toLowerCase().includes(qv));
  if(fs) list=list.filter(j=>j.status===fs);
  if(fp) list=list.filter(j=>j.pillar===fp);
  if(sort==='oldest') list.reverse(); if(sort==='priceHigh') list.sort((a,b)=>(parseInt(b.price)||0)-(parseInt(a.price)||0));
  if(!list.length) html=`<div class=card>No jobs</div>`;
  list.forEach(j=>{
   html+=`<div class=card>
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
   <div><span class=kbd>${j.id}</span> <span class=badge style="background:#334155;color:#fff">${j.status}</span><br><b>${j.fullService||''}</b><br><span style="font-size:12px">${j.clientName||''} • ${j.clientPhone||''}</span></div>
   <div style="text-align:right"><div style="font-size:20px;font-weight:900;color:var(--gold)">${j.price?'KSH '+j.price:'Pending'}</div></div>
   </div>
   ${j.adminMessage?`<div class="well g"><b>✅ Green Well:</b><br>${j.adminMessage}</div>`:''}
   ${j.revisionNote?`<div class="well r"><b>🔴 Revision:</b><br>${j.revisionNote}</div>`:''}
   <div class=grid2 style="margin-top:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:11px;color:#facc15;font-weight:800">PRICE</label><input id="p-${j.id}" class=input value="${j.price||''}"></div><div><label style="font-size:11px;color:#facc15;font-weight:800">STATUS</label><select id="s-${j.id}" class=select><option ${j.status==='Logged'?'selected':''}>Logged</option><option ${j.status==='Quoted'?'selected':''}>Quoted</option><option ${j.status==='Paid'?'selected':''}>Paid</option><option ${j.status==='In Progress'?'selected':''}>In Progress</option><option ${j.status==='Done'?'selected':''}>Done</option><option ${j.status==='Revision Needed'?'selected':''}>Revision Needed</option></select></div></div><div><label style="font-size:11px;color:#22c55e;font-weight:800">ADMIN MESSAGE</label><textarea id="m-${j.id}" class=textarea rows=2>${j.adminMessage||''}</textarea><label style="font-size:11px;color:#ef4444;font-weight:800">RED LOCK</label><textarea id="r-${j.id}" class=textarea rows=2 style="border-color:#ef4444">${j.revisionNote||''}</textarea></div></div>
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn gold" onclick="saveJob('${j.id}')">💾 Save & Push</button><button class="btn line" onclick="waJob('${j.id}')">WhatsApp</button><a class="btn line" href="track.html?job=${j.id}" target="_blank" style="text-decoration:none;text-align:center">View Client</a><button class="btn red" onclick="delJob('${j.id}')">🗑 DELETE</button></div>
   </div>`;
  });
 }
 if(TAB==='tickets'){
  let list=[...TICKETS]; let qv2=(q.value||'').toLowerCase(); if(qv2) list=list.filter(t=>JSON.stringify(t).toLowerCase().includes(qv2));
  if(!list.length) html=`<div class=card>No tickets</div>`;
  list.forEach(t=>{
   html+=`<div class=card><div><span class=kbd style="color:#60a5fa">${t.id}</span> for <b style="color:#facc15">${t.jobId}</b></div><b>${t.subject||''}</b><div class="well y">${t.message||''}</div>${t.adminReply?`<div class="well g">${t.adminReply}</div>`:''}<textarea id="tr-${t.id}" class=textarea rows=2>${t.adminReply||''}</textarea><select id="ts-${t.id}" class=select><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Closed'?'selected':''}>Closed</option></select><div style="display:flex;gap:8px;margin-top:8px"><button class="btn gold" onclick="saveTicket('${t.id}')">💾 Reply</button><button class="btn red" onclick="delTicket('${t.id}')">🗑 DELETE</button></div></div>`;
  });
 }
 if(TAB==='laundry'){
  let list=[...LAUNDRY]; if(qv) list=list.filter(l=>JSON.stringify(l).toLowerCase().includes(qv)); if(fs) list=list.filter(l=> (l.status||'').toLowerCase()===fs.toLowerCase() || l.steps?.some(s=>s.name===fs && s.status==='done'));
  if(!list.length) html=`<div class=card style="border-left:5px solid #facc15"><b>No Laundry LDY-</b><br><span style="font-size:12px;color:#94a3b8">Book from laundry.html — saves to Firestore collection laundry. Then track shows steps Received → Washing → Ironing → Ready → Delivered</span></div>`;
  list.forEach(l=>{
   let steps=l.steps||[
     {name:"Received",status:"done"},{name:"Washing",status:"pending"},{name:"Ironing / Pressing",status:"pending"},{name:"Ready for Pickup",status:"pending"},{name:"Delivered",status:"pending"}
   ];
   let stepBtns = steps.map((s,i)=>`<button class="stepBtn ${s.status==='done'?'done':''}" onclick="updateLaundryStep('${l.ticket||l.id}', ${i})">${s.status==='done'?'✅':'○'} ${s.name}</button>`).join(' ');
   html+=`<div class=card style="border-left:4px solid #facc15">
   <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><span class=kbd>${l.ticket||l.id}</span> <span class=badge style="background:#422006;color:#facc15">${l.status||'Received'}</span><br><b>${l.service||''}</b><br><span style="font-size:12px">${l.name||''} • ${l.phone||''} • ${l.location||''}</span><br><span style="font-size:12px;color:#facc15">🚚 ${l.delivery||''}</span></div><div style="text-align:right"><div style="font-size:20px;font-weight:900;color:#facc15">${l.total||''}</div><div style="font-size:11px;color:#94a3b8">${l.createdAt||''}</div></div></div>
   <div style="margin:12px 0"><b style="font-size:11px;color:#facc15;letter-spacing:.8px">STEPS FROM ADMIN — CLIENT SEES ON TRACK:</b><br><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${stepBtns}</div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn gold" onclick="markNextStep('${l.ticket||l.id}')">⏭ Mark Next Step Done</button><a class="btn line" href="track.html?laundry=${l.ticket||l.id}" target="_blank" style="text-decoration:none;text-align:center">View as Client</a><button class="btn line" onclick="waLaundry('${l.ticket||l.id}')">WhatsApp Client</button><button class="btn red" onclick="delLaundry('${l.ticket||l.id}')">🗑 DELETE LDY</button></div>
   </div>`;
  });
 }
 if(TAB==='pillars'){
  let pillars={}; JOBS.forEach(j=>{let p=j.pillar||'Unknown'; pillars[p]=(pillars[p]||0)+1});
  html+=`<div class=card><h3 style="color:var(--gold)">7 Pillars + Laundry</h3>`+Object.entries(pillars).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155"><span>${k}</span><b style="color:var(--gold)">${v}</b></div>`).join('')+`<div style="display:flex;justify-content:space-between;padding:8px 0"><span>Laundry</span><b style="color:#facc15">${LAUNDRY.length}</b></div></div>`;
 }
 document.getElementById('list').innerHTML=html;
}

window.saveJob=async(id)=>{
 let j=JOBS.find(x=>x.id===id); if(!j) return;
 j.price=document.getElementById('p-'+id).value; j.status=document.getElementById('s-'+id).value; j.adminMessage=document.getElementById('m-'+id).value; j.revisionNote=document.getElementById('r-'+id).value;
 if(j.revisionNote && j.revisionNote.trim()!=='') j.status='Revision Needed';
 let local=JSON.parse(localStorage.getItem('veccta_jobs')||'[]'); let idx=local.findIndex(x=>x.id===id); if(idx>=0) local[idx]=j; else local.push(j); localStorage.setItem('veccta_jobs',JSON.stringify(local));
 if(j._docId){ try{await updateDoc(doc(db,'jobs',j._docId),{price:j.price,status:j.status,adminMessage:j.adminMessage,revisionNote:j.revisionNote});}catch(e){alert(e.message)} }
 renderStats(); render(); alert('✅ Saved');
}
window.waJob=id=>{let j=JOBS.find(x=>x.id===id); let msg=`Hello ${j.clientName}, ${j.id} is ${j.status}. Price KSH ${j.price}. ${j.adminMessage}`; window.open('https://wa.me/'+(j.clientPhone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg))}
window.saveTicket=async id=>{ let t=TICKETS.find(x=>x.id===id); t.adminReply=document.getElementById('tr-'+id).value; t.status=document.getElementById('ts-'+id).value; if(t._docId){try{await updateDoc(doc(db,'tickets',t._docId),{adminReply:t.adminReply,status:t.status});}catch(e){alert(e.message)}} alert('✅ Ticket saved'); render(); }

window.updateLaundryStep=async(ticketId, stepIdx)=>{
 let l=LAUNDRY.find(x=>(x.ticket||x.id)===ticketId); if(!l) return;
 if(!l.steps) l.steps=[{name:"Received",status:"done"},{name:"Washing",status:"pending"},{name:"Ironing / Pressing",status:"pending"},{name:"Ready for Pickup",status:"pending"},{name:"Delivered",status:"pending"}];
 l.steps[stepIdx].status = l.steps[stepIdx].status==='done'? 'pending' : 'done';
 l.steps[stepIdx].time = new Date().toLocaleString();
 l.steps[stepIdx].updatedBy = 'Admin';
 l.status = l.steps[stepIdx].name;
 // save local
 localStorage.setItem('order_'+ticketId, JSON.stringify(l));
 // save cloud
 try{ await updateDoc(doc(db,'laundry',ticketId),{steps:l.steps,status:l.status}); cloudSt.textContent=`✅ ${l.steps[stepIdx].name} updated for ${ticketId}`; }catch(e){
   // if doc doesn't exist as update, try set
   try{ const {setDoc}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"); await setDoc(doc(db,'laundry',ticketId), l); }catch(e2){ alert('Cloud save failed: '+e.message); }
 }
 render();
}

window.markNextStep=async(ticketId)=>{
 let l=LAUNDRY.find(x=>(x.ticket||x.id)===ticketId); if(!l) return;
 let idx = l.steps.findIndex(s=>s.status!=='done'); if(idx===-1) return alert('All done — Delivered');
 await updateLaundryStep(ticketId, idx);
}

window.waLaundry=id=>{let l=LAUNDRY.find(x=>(x.ticket||x.id)===id); let msg=`Hi ${l.name}, Laundry ${id} is ${l.status}. Delivery: ${l.delivery}. Total ${l.total}. Track: track.html?laundry=${id}`; window.open('https://wa.me/'+(l.phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg))}

window.delJob=async id=>{ let j=JOBS.find(x=>x.id===id); if(!confirm('DELETE JOB '+j.id+'?')) return; try{ if(j._docId) await deleteDoc(doc(db,'jobs',j._docId)); }catch(e){} JOBS=JOBS.filter(x=>x.id!==id); localStorage.setItem('veccta_jobs',JSON.stringify(JOBS)); renderStats(); render(); }
window.delTicket=async id=>{ let t=TICKETS.find(x=>x.id===id); if(!confirm('DELETE TICKET '+t.id+'?')) return; try{ if(t._docId) await deleteDoc(doc(db,'tickets',t._docId)); }catch(e){} TICKETS=TICKETS.filter(x=>x.id!==id); render(); }
window.delLaundry=async id=>{
 if(!confirm('🗑 DELETE LAUNDRY '+id+' PERMANENTLY? Client track will show NOT FOUND.')) return;
 try{ await deleteDoc(doc(db,'laundry',id)); }catch(e){ console.log(e); }
 LAUNDRY=LAUNDRY.filter(x=>(x.ticket||x.id)!==id); localStorage.removeItem('order_'+id);
 renderStats(); render(); alert('✅ '+id+' deleted');
}

window.exportCSV=()=>{let csv='ID,Name,Phone,Service,Total,Status,Delivery\n'+LAUNDRY.map(l=>`"${l.ticket||l.id}","${l.name||''}","${l.phone||''}","${l.service||''}","${l.total||''}","${l.status||''}","${l.delivery||''}"`).join('\n')+'\n\nJOBS\nID,Name,Phone,Pillar,Price,Status\n'+JOBS.map(j=>`"${j.id}","${j.clientName||''}","${j.clientPhone||''}","${j.pillar||''}","${j.price||''}","${j.status||''}"`).join('\n'); let b=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='veccta_all.csv'; a.click()}
</script>
</body></html>
