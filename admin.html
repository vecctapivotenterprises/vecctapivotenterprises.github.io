<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — VECCTAPIVOT GLOBAL Till 1741514</title><link rel="icon" href="logo.png">
<style>
body{background:#0f172a;color:#e2e8f0;font-family:system-ui;margin:0;padding:0}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;margin:10px 0}
.input,select{padding:10px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #334155;width:100%;box-sizing:border-box;margin:4px 0}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-gold{background:#facc15;color:#000}.btn-green{background:#22c55e;color:#000}.btn-red{background:#ef4444;color:#fff}.btn-line{background:#0f172a;border:1px solid #334155;color:#94a3b8}
.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0;position:sticky;top:0;background:#0f172a;padding:8px 0;z-index:5}
.tab{padding:9px 16px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;white-space:nowrap}.tab.on{background:#facc15;color:#000;font-weight:900}
.stat{display:flex;gap:10px;flex-wrap:wrap}.stat div{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px 14px;min-width:110px;text-align:center}.stat b{color:#facc15;font-size:18px;display:block}
.step-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.step-btn{padding:6px 10px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;font-size:11px}.step-btn.done{background:#422006;color:#facc15;border-color:#facc15;font-weight:800}
.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#422006;color:#facc15;border:1px solid #facc15}
.small{font-size:11px;color:#94a3b8} table{width:100%;border-collapse:collapse} th,td{border-bottom:1px solid #334155;padding:8px;text-align:left;font-size:12px}
</style></head><body>
<div class="wrap">
<div id="loginBox" class="card" style="max-width:400px;margin:100px auto;text-align:center">
<img src="logo.png" style="width:70px"><h3 style="color:#facc15">Admin Login</h3>
<input id="adminEmail" class="input" placeholder="Admin Email">
<input id="adminPass" type="password" class="input" placeholder="Password">
<button type="button" id="loginBtn" class="btn btn-gold" style="width:100%;margin-top:10px">LOGIN →</button>
<p class="small">Till 1741514 Secure Panel</p>
</div>
<div id="mainApp" style="display:none">
<h2 style="color:#facc15;text-align:center">VECCTAPIVOT ADMIN — Till 1741514 <span style="float:right"><button onclick="location.reload()" class="btn btn-line" style="font-size:11px">🔄</button> <button id="logoutBtn" class="btn btn-red" style="font-size:11px">Logout</button></span></h2>
<div class="stat" id="stats"></div>
<div class="tabs">
<button class="tab on" id="tabLaundry">🧺 Laundry</button>
<button class="tab" id="tabJobs">💼 Jobs</button>
<button class="tab" id="tabTickets">🎫 Tickets</button>
<button class="tab" onclick="location.href='track.html'">🔍 Track</button>
</div>
<input id="searchBox" class="input" placeholder="🔍 Search ticket / name / phone / LDY-">
<div id="laundrySec"></div>
<div id="jobsSec" style="display:none"></div>
<div id="ticketsSec" style="display:none"></div>
</div>
</div>

<script>
// --- LOGIN PLAIN - ALWAYS WORKS ---
const ADMIN_EMAIL="admin@vecctapivot.com";
const ADMIN_PASS="veccta2024";
function doLogin(){
  let e=document.getElementById('adminEmail').value.trim();
  let p=document.getElementById('adminPass').value.trim();
  if(e===ADMIN_EMAIL && p===ADMIN_PASS){
    localStorage.setItem('veccta_admin','true');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('mainApp').style.display='block';
  }else{ alert('Wrong Email or Password. Use admin@vecctapivot.com / veccta2024'); }
}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('adminPass').addEventListener('keypress',function(ev){ if(ev.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('veccta_admin');location.reload();});
if(localStorage.getItem('veccta_admin')==='true'){ document.getElementById('loginBox').style.display='none'; document.getElementById('mainApp').style.display='block'; }
function showTab(n){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  if(n==='laundry') document.getElementById('tabLaundry').classList.add('on');
  if(n==='jobs') document.getElementById('tabJobs').classList.add('on');
  if(n==='tickets') document.getElementById('tabTickets').classList.add('on');
  document.getElementById('laundrySec').style.display=n==='laundry'?'block':'none';
  document.getElementById('jobsSec').style.display=n==='jobs'?'block':'none';
  document.getElementById('ticketsSec').style.display=n==='tickets'?'block':'none';
}
document.getElementById('tabLaundry').addEventListener('click',()=>showTab('laundry'));
document.getElementById('tabJobs').addEventListener('click',()=>showTab('jobs'));
document.getElementById('tabTickets').addEventListener('click',()=>showTab('tickets'));
document.getElementById('searchBox').addEventListener('input',()=>{ window.FILTER=document.getElementById('searchBox').value.toLowerCase(); window.renderAll&&window.renderAll(); });
</script>

<script type="module">
import { db } from './firebase.js';
import { collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
window.LAUNDRY=[]; window.JOBS=[]; window.TICKETS=[]; window.FILTER="";
const ORDER=["Received","Washing","Ironing / Pressing","Ready for Pickup","Please Pay","Payment Confirmed","Request Dispatch","Out for Delivery","Delivered"];
function defaultStepsLaund(l){
  let s=(l.status||'').toLowerCase(); let cur=-1;
  if(s.includes('receiv')) cur=0; else if(s.includes('wash')) cur=1; else if(s.includes('iron')) cur=2; else if(s.includes('ready')) cur=3; else if(s.includes('please')) cur=4; else if(s.includes('payment')||s.includes('confirm')) cur=5; else if(s.includes('request')) cur=6; else if(s.includes('dispatch')||s.includes('out')) cur=7; else if(s.includes('deliver')) cur=8;
  let steps=l.steps||ORDER.map(n=>({name:n,status:"pending",time:""}));
  return ORDER.map((name,i)=>({name,status:(steps[i]?.status==="done"||i<=cur)?"done":"pending",time:steps[i]?.time||""}));
}
window.updateLaundryStep=async(id,idx)=>{ let l=LAUNDRY.find(x=>x._docId===id); l.steps=ORDER.map((name,i)=>({name,status:i<=idx?"done":"pending",time:i===idx?new Date().toLocaleString(): (l.steps[i]?.time||"") })); let ns=ORDER[idx]; if(ns==="Ready for Pickup") ns="Please Pay"; await updateDoc(doc(db,'laundry',id),{steps:l.steps,status:ns}); }
window.deleteLaundry=async(id)=>{ if(confirm('Delete?')) await deleteDoc(doc(db,'laundry',id)); }
window.deleteJob=async(id)=>{ if(confirm('Delete job?')) await deleteDoc(doc(db,'jobs',id)); }
window.deleteTicket=async(id)=>{ if(confirm('Delete ticket?')) await deleteDoc(doc(db,'tickets',id)); }
window.saveRider=async(id)=>{ let rn=document.getElementById('rName_'+id).value, rt=document.getElementById('rTel_'+id).value, rp=document.getElementById('rPlate_'+id).value, ac=document.getElementById('aComment_'+id).value; let l=LAUNDRY.find(x=>x._docId===id); let receipt=l.receiptNo||`RCP-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(1000+Math.random()*9000)}`; await updateDoc(doc(db,'laundry',id),{riderName:rn,riderTel:rt,riderPlate:rp,bikeNumber:rp,adminComment:ac,receiptNo:receipt,status:'Out for Delivery',eta:new Date().toLocaleString()}); }
window.verifyPay=async(id)=>{ let l=LAUNDRY.find(x=>x._docId===id); let receipt=l.receiptNo||`RCP-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(1000+Math.random()*9000)}`; await updateDoc(doc(db,'laundry',id),{paid:true,paymentStatus:'PAID Till 1741514',status:'Payment Confirmed',receiptNo:receipt,steps:ORDER.map((n,i)=>({name:n,status:i<=5?"done":"pending",time:i===5?new Date().toLocaleString():""}))}); }
window.markScheduleNoted=async(id)=>{ let ac=document.getElementById('aComment_'+id).value; await updateDoc(doc(db,'laundry',id),{scheduleNoted:true,adminComment:ac}); }
window.saveJob=async(id)=>{ let m=document.getElementById('jobMsg_'+id).value; await updateDoc(doc(db,'jobs',id),{adminMessage:m}); }
window.updateJobStatus=async(id,st)=>{ await updateDoc(doc(db,'jobs',id),{status:st}); }
window.saveTic=async(id)=>{ let r=document.getElementById('ticReply_'+id).value; await updateDoc(doc(db,'tickets',id),{adminReply:r,status:'In Progress'}); }
window.updateTicStatus=async(id,st)=>{ await updateDoc(doc(db,'tickets',id),{status:st}); }
window.renderAll=()=>{
  let f=window.FILTER||"";
  let fl=LAUNDRY.filter(l=>!f||(JSON.stringify(l).toLowerCase().includes(f)));
  let fj=JOBS.filter(j=>!f||(JSON.stringify(j).toLowerCase().includes(f)));
  let ft=TICKETS.filter(t=>!f||(JSON.stringify(t).toLowerCase().includes(f)));
  let totalEarning=0, laundryEarn=0, jobsEarn=0;
  LAUNDRY.forEach(l=>{ let closed=(l.paid===true)||(l.paymentStatus||'').includes('PAID')||(l.status||'').toLowerCase().includes('deliver')||(l.status||'').toLowerCase().includes('confirm'); if(closed){ let a=parseFloat((l.total+'').replace(/[^0-9.]/g,''))||0; totalEarning+=a; laundryEarn+=a; } });
  JOBS.forEach(j=>{ let closed=(j.status||'').toLowerCase().includes('done')||(j.status||'').toLowerCase().includes('deliver'); if(closed){ let a=parseFloat((j.price+'').replace(/[^0-9.]/g,''))||0; totalEarning+=a; jobsEarn+=a; } });
  document.getElementById('stats').innerHTML=`<div><b>${LAUNDRY.length}</b>Laundry</div><div><b>${JOBS.length}</b>Jobs</div><div><b>${TICKETS.length}</b>Tickets</div><div><b>${LAUNDRY.filter(l=>l.status==='Please Pay').length}</b>Need Pay</div><div style="background:#facc15;color:#000;border-color:#facc15;min-width:200px"><b style="color:#000;font-size:20px">KES ${totalEarning.toLocaleString()}</b><span style="font-size:11px;color:#000;font-weight:800;display:block">Closed • L:${laundryEarn.toLocaleString()} + J:${jobsEarn.toLocaleString()}</span></div>`;
  let h=`<div class=card><b style="color:#facc15">🧺 Laundry — ${fl.length}/${LAUNDRY.length}</b></div>`;
  fl.forEach(l=>{ let steps=defaultStepsLaund(l); h+=`<div class=card><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><b style="color:#facc15">${l.ticket||l.id}</b> <span class=badge>${l.status} • ${l.paid?'PAID':l.paymentStatus||'NOT PAID'}</span><br><span class=small>${l.name||''} ${l.phone||''} | KES ${(l.total+'').replace(/KES/gi,'')} | RCP ${l.receiptNo||'—'}</span></div><div style="display:flex;gap:6px"><a href="track.html?laundry=${l.ticket||l.id}" target="_blank" class="btn btn-line" style="font-size:11px">View</a><button class="btn btn-red" style="font-size:11px" onclick="deleteLaundry('${l._docId}')">🗑️</button></div></div><div class=step-row>${ORDER.map((name,i)=>`<button class="step-btn ${steps[i].status==='done'?'done':''}" onclick="updateLaundryStep('${l._docId}',${i})">${steps[i].status==='done'?'✅':'○'} ${name}</button>`).join('')}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="rName_${l._docId}" class="input" style="width:140px" placeholder="Rider" value="${l.riderName||''}"><input id="rTel_${l._docId}" class="input" style="width:140px" placeholder="Tel" value="${l.riderTel||''}"><input id="rPlate_${l._docId}" class="input" style="width:140px" placeholder="Plate" value="${l.riderPlate||l.bikeNumber||''}"><input id="aComment_${l._docId}" class="input" style="flex:1;min-width:200px" placeholder="Admin comment" value="${l.adminComment||''}"></div><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn btn-gold" onclick="saveRider('${l._docId}')">Save Rider + Dispatch</button><button class="btn btn-green" onclick="verifyPay('${l._docId}')">Verify Pay Till 1741514</button><button class="btn btn-line" onclick="markScheduleNoted('${l._docId}')">Noted ✓</button></div></div>`; }); document.getElementById('laundrySec').innerHTML=h;
  let hj=`<div class=card><table><tr><th>Ticket</th><th>Client</th><th>Status</th><th>Action</th></tr>${fj.map(j=>`<tr><td>${j.id||j.ticket}</td><td>${j.clientName||j.name||''}</td><td><span class=badge>${j.status||''}</span></td><td><button class="btn btn-line" style="font-size:10px" onclick="document.getElementById('jobDetail_${j._docId}').style.display='block'">Open</button> <button class="btn btn-red" style="font-size:10px" onclick="deleteJob('${j._docId}')">🗑️</button></td></tr><tr id="jobDetail_${j._docId}" style="display:none"><td colspan=4><input id="jobMsg_${j._docId}" class="input" value="${j.adminMessage||''}"><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-gold" onclick="saveJob('${j._docId}')">Save</button><button class="btn btn-green" onclick="updateJobStatus('${j._docId}','Done')">Done</button></div></td></tr>`).join('')+`</table></div>`; document.getElementById('jobsSec').innerHTML=hj;
  let ht=`<div class=card><table><tr><th>Ticket</th><th>Msg</th><th>Status</th><th>Action</th></tr>${ft.map(t=>`<tr><td>${t.id||t.ticket}</td><td><span class=small>${t.message||''}</span></td><td><span class=badge>${t.status||''}</span></td><td><button class="btn btn-line" style="font-size:10px" onclick="document.getElementById('ticDetail_${t._docId}').style.display='block'">Reply</button> <button class="btn btn-red" style="font-size:10px" onclick="deleteTicket('${t._docId}')">🗑️</button></td></tr><tr id="ticDetail_${t._docId}" style="display:none"><td colspan=4><input id="ticReply_${t._docId}" class="input" value="${t.adminReply||''}"><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-gold" onclick="saveTic('${t._docId}')">Reply</button><button class="btn btn-green" onclick="updateTicStatus('${t._docId}','Closed')">Close</button></div></td></tr>`).join('')+`</table></div>`; document.getElementById('ticketsSec').innerHTML=ht;
}
onSnapshot(query(collection(db,'laundry'),orderBy('createdAt','desc')),s=>{LAUNDRY=s.docs.map(d=>({...d.data(),_docId:d.id}));renderAll();});
onSnapshot(query(collection(db,'jobs'),orderBy('createdAt','desc')),s=>{JOBS=s.docs.map(d=>({...d.data(),_docId:d.id}));renderAll();});
onSnapshot(query(collection(db,'tickets'),orderBy('createdAt','desc')),s=>{TICKETS=s.docs.map(d=>({...d.data(),_docId:d.id}));renderAll();});
</script></body></html>
