<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Websuite</title><link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:1100px;margin:12px auto;padding:0 12px}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{padding:10px 16px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#94a3b8;cursor:pointer;font-weight:800}
.tab.active{background:#facc15;color:#000;border-color:#facc15}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;margin:10px 0}
.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;background:#422006;color:#facc15;border:1px solid #facc15}
.input{padding:10px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #334155;width:100%;box-sizing:border-box;margin:4px 0}
.btn{padding:10px;border:none;border-radius:10px;font-weight:800;cursor:pointer}.gold{background:#facc15;color:#000}.green{background:#22c55e;color:#000}
.kbd{font-family:ui-monospace;color:#facc15;font-weight:900}
</style></head><body>
<main class="wrap">
<h2 style="color:#facc15">Websuite Admin — Till 1741514</h2>
<div id="avgBox" class="card" style="border-color:#facc15;text-align:center;color:#facc15;font-weight:900">⭐ Loading reviews...</div>
<div class="tabs">
<button class="tab active" onclick="switchTab('laundry')" id="tab-laundry">🧺 Laundry (<span id="c-laundry">0</span>)</button>
<button class="tab" onclick="switchTab('jobs')" id="tab-jobs">💼 Jobs (<span id="c-jobs">0</span>)</button>
<button class="tab" onclick="switchTab('tickets')" id="tab-tickets">🎫 Tickets (<span id="c-tickets">0</span>)</button>
</div>
<div id="out">Loading...</div>
</main>
<script type="module">
import { db } from './firebase.js';
import { collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
let allLaundry=[], allJobs=[], allTics=[], current='laundry';
window.switchTab=(t)=>{
 current=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); render();
}
function calcAvg(){
 let all=[...allLaundry,...allJobs,...allTics].filter(x=>x.rating>0);
 let avg=all.length? (all.reduce((a,b)=>a+b.rating,0)/all.length).toFixed(1):0;
 document.getElementById('avgBox').innerHTML=`⭐ Avg Rating ${avg}/5 from ${all.length} reviews — Laundry ${allLaundry.filter(x=>x.rating).length} | Jobs ${allJobs.filter(x=>x.rating).length} | Tickets ${allTics.filter(x=>x.rating).length}`;
}
function render(){
 let list = current==='laundry'?allLaundry: current==='jobs'?allJobs:allTics;
 let html='';
 if(!list.length) html=`<div class=card>No ${current} yet</div>`;
 list.forEach(l=>{
   let stars = l.rating ? `<div style="background:#422006;border:1px solid #facc15;padding:8px;border-radius:10px;margin-top:6px"><b style="color:#facc15">${'★'.repeat(l.rating)}${'☆'.repeat(5-l.rating)} ${l.rating}/5</b> <span style="color:#fff">“${l.comment||'No comment'}”</span><br><span style="font-size:11px;color:#94a3b8">${l.receivedAt||''} ${l.receiptNo?`• RCP ${l.receiptNo}`:''}</span></div>` : `<div style="color:#94a3b8;font-size:11px;margin-top:6px">⭐ No review yet</div>`;
   if(current==='laundry'){
     html+=`<div class=card><div style="display:flex;justify-content:space-between"><span class=kbd>${l.ticket}</span><span class=badge>${l.status||''} • KES ${l.total||0}</span></div><div style="font-size:12px;color:#cbd5e1">Name: ${l.name||''} Phone: ${l.phone||''} Code: ${l.mpesaCode||''}</div><div style="font-size:12px">Rider <input id="rn-${l.id}" class="input" placeholder="Rider name" value="${l.riderName||''}"> Tel <input id="rt-${l.id}" class="input" value="${l.riderTel||''}"> Plate <input id="rp-${l.id}" class="input" value="${l.riderPlate||''}"> Sign <input id="sg-${l.id}" class="input" value="${l.signature||''}"> Close <input id="ct-${l.id}" class="input" value="${l.closeTime||''}"></div><button class="btn gold" onclick="dispatch('${l.id}')">🚚 Dispatch + Gen RCP</button> ${stars}</div>`;
   } else if(current==='jobs'){
     html+=`<div class=card><span class=kbd>${l.ticket}</span> <span class=badge>💼 ${l.status}</span><br>Title: ${l.title||l.service||''}<br>Client: ${l.name||''} ${l.phone||''}<br>Assigned <input id="rn-${l.id}" class="input" value="${l.assignedTo||l.riderName||''}" placeholder="Assigned to"><br>Status <select id="st-${l.id}" class="input"><option ${l.status==='Open'?'selected':''}>Open</option><option ${l.status==='In Progress'?'selected':''}>In Progress</option><option ${l.status==='Completed'?'selected':''}>Completed</option></select><button class="btn gold" onclick="updateJob('${l.id}')">Save</button> ${stars}</div>`;
   } else {
     html+=`<div class=card><span class=kbd>${l.ticket}</span> <span class=badge>🎫 ${l.status}</span><br>Issue: ${l.issue||l.description||''}<br>Customer: ${l.name||''} ${l.phone||''}<br>Priority ${l.priority||''}<br>Agent <input id="rn-${l.id}" class="input" value="${l.agent||''}" placeholder="Agent"><br>Status <select id="st-${l.id}" class="input"><option ${l.status==='Open'?'selected':''}>Open</option><option ${l.status==='In Progress'?'selected':''}>In Progress</option><option ${l.status==='Resolved'?'selected':''}>Resolved</option><option ${l.status==='Closed'?'selected':''}>Closed</option></select><button class="btn gold" onclick="updateTic('${l.id}')">Save</button> ${stars}</div>`;
   }
 });
 document.getElementById('out').innerHTML=html;
}
function genRCP(){ let d=new Date(); return `RCP-${d.toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(1000+Math.random()*9000)}`; }
window.dispatch=async(id)=>{
 let rn=document.getElementById('rn-'+id).value; let rt=document.getElementById('rt-'+id).value; let rp=document.getElementById('rp-'+id).value; let sg=document.getElementById('sg-'+id).value; let ct=document.getElementById('ct-'+id).value;
 let rcp=genRCP();
 await updateDoc(doc(db,'laundry',id),{ riderName:rn, riderTel:rt, riderPlate:rp, signature:sg, closeTime:ct, status:'Dispatched', receiptNo:rcp, steps: [{name:'Received',status:'done',time:new Date().toLocaleString()},{name:'Paid',status:'done',time:new Date().toLocaleString()},{name:'Dispatched',status:'done',time:new Date().toLocaleString()},{name:'Delivered',status:'todo',time:''}] });
 alert('Dispatched + RCP '+rcp);
}
window.updateJob=async(id)=>{ let a=document.getElementById('rn-'+id).value; let s=document.getElementById('st-'+id).value; await updateDoc(doc(db,'jobs',id),{assignedTo:a,status:s}); alert('Job saved'); }
window.updateTic=async(id)=>{ let a=document.getElementById('rn-'+id).value; let s=document.getElementById('st-'+id).value; await updateDoc(doc(db,'tickets',id),{agent:a,status:s}); alert('Ticket saved'); }

// LIVE listeners for all 3 collections
onSnapshot(collection(db,'laundry'), snap=>{
 allLaundry=snap.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('c-laundry').innerText=allLaundry.length; calcAvg(); if(current==='laundry')render();
});
onSnapshot(collection(db,'jobs'), snap=>{
 allJobs=snap.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('c-jobs').innerText=allJobs.length; calcAvg(); if(current==='jobs')render();
});
onSnapshot(collection(db,'tickets'), snap=>{
 allTics=snap.docs.map(d=>({id:d.id,...d.data()})); document.getElementById('c-tickets').innerText=allTics.length; calcAvg(); if(current==='tickets')render();
});
</script></body></html>
