<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin GLOBAL — Ready → Pay → Verify → Dispatch → Rider → Delivered</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css">
<style>:root{--gold:#facc15;--green:#22c55e;--red:#ef4444;--bg:#070a14;--card:#1e293b;--line:#334155}*{box-sizing:border-box}body{background:#070a14;color:#fff;font-family:Inter,system-ui;margin:0}.topbar{background:#000;border-bottom:2px solid var(--gold);padding:12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px}.page{max-width:1320px;margin:0 auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}.s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.s b{font-size:20px;display:block;color:var(--gold)}.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#0f172a;color:#cbd5e1;font-weight:800;cursor:pointer;font-size:12px}.tab.active{background:var(--gold);color:#000}.card{background:#1e293b;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.input,.select,.textarea{padding:11px;border-radius:10px;background:#0f172a;border:1px solid var(--line);color:#fff;width:100%;box-sizing:border-box;margin:4px 0}.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:12px}.gold{background:var(--gold);color:#000}.red{background:var(--red);color:#fff}.line{background:transparent;border:1px solid var(--line);color:#fff}.badge{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900}.kbd{font-family:monospace;color:var(--gold);font-weight:900}.stepBtn{padding:8px 10px;border-radius:999px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:11px;font-weight:800;cursor:pointer}.stepBtn.done{background:#052e16;border-color:#22c55e;color:#22c55e}.well{padding:10px;border-radius:12px;margin:8px 0;border:1px solid;font-size:12px}.g{border-color:var(--green);background:#052e16}.r{border-color:var(--red);background:#450a0a}.y{border-color:var(--gold);background:#422006}.b{border-color:#60a5fa;background:#0c1a32}.grid2{display:grid;grid-template-columns:1fr 340px;gap:12px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}</style>
</head><body>
<div class="topbar"><div style="display:flex;gap:10px;align-items:center"><b style="color:var(--gold)">VECCTAPIVOT ADMIN — Ready → Pay → Dispatch → Rider</b><span id="cloudSt" style="font-size:11px;color:#94a3b8">●</span> <span id="timer" style="font-size:11px;color:var(--gold)"></span></div><div style="display:flex;gap:6px"><button class="btn line" onclick="loadCloud()">↻ Cloud</button><button class="btn line" onclick="logout()">Logout</button><a class="btn line" href="index.html" style="text-decoration:none">Home</a></div></div>
<div class="page">
<div id="loginBox" class="card" style="max-width:420px;margin:60px auto;text-align:center"><h3 style="color:var(--gold)">Admin Login — 10min Auto Logout</h3><p style="font-size:11px;color:#94a3b8">LIVE PAY + VERIFY CODE + RIDER</p><input id="pw" type="password" class="input" placeholder="Enter password"><button class="btn gold" style="width:100%;margin-top:10px;padding:12px" id="loginBtn">Login GLOBAL</button></div>
<div id="panel" hidden>
<div class="stats"><div class="s"><b id="cTotal">0</b><small>Total Jobs</small></div><div class="s"><b id="cNew">0</b><small>New</small></div><div class="s"><b id="cRev">0</b><small>Revision</small></div><div class="s"><b id="cPaid">0</b><small>Paid/Done</small></div><div class="s"><b id="cTic">0</b><small>Tickets</small></div><div class="s"><b id="cLaund">0</b><small>Laundry</small></div><div class="s"><b id="cMoney">0</b><small>KSH</small></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tab active" id="tab-jobs" onclick="setTab('jobs')">📦 Jobs</span><span class="tab" id="tab-tickets" onclick="setTab('tickets')">🎫 Tickets</span><span class="tab" id="tab-laundry" onclick="setTab('laundry')">👕 Laundry — NEW FLOW</span><span class="tab" id="tab-pillars" onclick="setTab('pillars')">🏛 Pillars</span></div>
<div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap"><input id="q" class="input" placeholder="Search JOB-, TIC-, LDY-, name, code QGH..." oninput="render()" style="flex:1;min-width:220px"><select id="fStat" class="select" onchange="render()"><option value="">All Status</option><option>Received</option><option>Washing</option><option>Ironing / Pressing</option><option>Ready for Pickup</option><option>Please Pay</option><option>Payment Confirmed</option><option>Request Dispatch</option><option>Out for Delivery</option><option>Dispatched</option><option>Delivered</option><option>Logged</option><option>Done</option></select></div>
<div id="list"></div>
</div>
</div>
<script type="module">
import { db } from './firebase.js';
import { collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const ADMIN_B64 = "dmVjY3RhMjAyNA=="; const LOGOUT_MIN = 10;
let JOBS=[], TICKETS=[], LAUNDRY=[], TAB='laundry', logoutTimer, countTimer, left=LOGOUT_MIN*60, laundryUnsub=null;
function b64d(s){ try{return atob(s)}catch{return""} }
async function hashCheck(input){ return input === b64d(ADMIN_B64); }
window.login=async()=>{ let passVal = document.getElementById('pw').value; if(await hashCheck(passVal)){ loginBox.hidden=true; panel.hidden=false; startTimers(); loadCloud(); } else alert('Wrong password'); }
document.getElementById('loginBtn').addEventListener('click', ()=>{ window.login(); });
document.getElementById('pw').addEventListener('keypress', (e)=>{ if(e.key==='Enter') window.login(); });
window.logout=()=>{ panel.hidden=true; loginBox.hidden=false; document.getElementById('pw').value=""; clearInterval(countTimer); clearTimeout(logoutTimer); if(laundryUnsub) laundryUnsub(); cloudSt.textContent="● Logged out"; left=LOGOUT_MIN*60; }
function startTimers(){ clearTimeout(logoutTimer); clearInterval(countTimer); left=LOGOUT_MIN*60; let tick=()=>{ left--; let m=Math.floor(left/60), s=left%60; document.getElementById('timer').textContent=`Auto logout ${m}:${String(s).padStart(2,'0')}`; if(left<=0) logout(); }; countTimer=setInterval(tick,1000); let reset=()=>{ clearTimeout(logoutTimer); logoutTimer=setTimeout(logout, LOGOUT_MIN*60*1000); left=LOGOUT_MIN*60; }; ['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev, reset)); reset(); }
function norm(d){ let data=d.data(); return {...data, _docId:d.id, _showId:data.id||data.ticket||d.id, id:data.id||data.ticket||d.id, ticket:data.ticket||data.id||d.id}; }
window.loadCloud=async()=>{
 cloudSt.textContent='● Syncing...'; cloudSt.style.color='#facc15';
 try{
  let snap=await getDocs(query(collection(db,'jobs'), orderBy('createdAt','desc'), limit(300))); let cloud=[]; snap.forEach(d=>cloud.push(norm(d)));
  let snap2=await getDocs(query(collection(db,'tickets'), orderBy('createdAt','desc'), limit(200))); let cloudT=[]; snap2.forEach(d=>cloudT.push(norm(d)));
  JOBS=cloud; TICKETS=cloudT;
  if(laundryUnsub) laundryUnsub();
  laundryUnsub = onSnapshot(query(collection(db,'laundry'), orderBy('createdAt','desc'), limit(200)), (snap3)=>{
    let cloudL=[]; snap3.forEach(d=>cloudL.push(norm(d)));
    LAUNDRY=cloudL; renderStats(); render();
    cloudSt.textContent=`● Cloud LIVE ${cloud.length}/${cloudT.length}/${cloudL.length} | LIVE`; cloudSt.style.color='#22c55e';
  });
 }catch(e){ cloudSt.textContent='● Error — '+e.message; cloudSt.style.color='#ef4444'; }
}
function renderStats(){ cTotal.textContent=JOBS.length; cNew.textContent=JOBS.filter(j=>j.status==='Logged').length; cRev.textContent=JOBS.filter(j=>['Revision Needed','Resubmitted'].includes(j.status)).length; cPaid.textContent=JOBS.filter(j=>['Paid','Done'].includes(j.status)).length; cTic.textContent=TICKETS.length; cLaund.textContent=LAUNDRY.length; cMoney.textContent='KSH '+(JOBS.reduce((s,j)=>s+(parseInt(j.price)||0),0).toLocaleString()); }
window.setTab=t=>{TAB=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); document.getElementById('tab-'+t).classList.add('active'); render();}
function starsHtml(o){ if(!o.rating) return `<div style="font-size:11px;color:#94a3b8">⭐ No review yet — After Delivered user rates</div>`; return `<div class="well y"><b style="color:#facc15">${'★'.repeat(o.rating)}${'☆'.repeat(5-o.rating)} ${o.rating}/5</b> <span style="color:#fff">“${o.comment||''}”</span><br><small style="color:#94a3b8">${o.receivedAt||''} ${o.receiptNo?`• ${o.receiptNo}`:''} ${o.mpesaCode?`• ${o.mpesaCode}`:''}</small></div>`; }
function defaultStepsJob(j){ if(j.steps) return j.steps; return [{name:"Logged",status:"done"},{name:"Quoted",status:j.price?"done":"pending"},{name:"Paid",status:j.status==='Paid'||j.status==='Done'?"done":"pending"},{name:"In Progress",status:j.status==='In Progress'||j.status==='Done'?"done":"pending"},{name:"Done",status:j.status==='Done'?"done":"pending"}]; }
function defaultStepsTic(t){ if(t.steps) return t.steps; return [{name:"Open",status:"done"},{name:"In Progress",status:t.status==='In Progress'||t.status==='Closed'?"done":"pending"},{name:"Admin Reply",status:t.adminReply?"done":"pending"},{name:"Closed",status:t.status==='Closed'?"done":"pending"}]; }
function defaultStepsLaund(l){ if(l.steps && l.steps.length>=8) return l.steps; return [{name:"Received",status:"done"},{name:"Washing",status:['Washing','Ironing / Pressing','Ready for Pickup','Please Pay','Payment Confirmed','Request Dispatch','Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Ironing / Pressing",status:['Ironing / Pressing','Ready for Pickup','Please Pay','Payment Confirmed','Request Dispatch','Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Ready for Pickup",status:['Ready for Pickup','Please Pay','Payment Confirmed','Request Dispatch','Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Please Pay",status:['Please Pay','Payment Confirmed','Request Dispatch','Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Payment Confirmed",status:['Payment Confirmed','Request Dispatch','Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Request Dispatch",status:['Request Dispatch','Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Out for Delivery",status:['Out for Delivery','Dispatched','Delivered'].includes(l.status)?"done":"pending"},{name:"Delivered",status:l.status==='Delivered'?"done":"pending"}]; }
window.saveJob=async(docId)=>{ let j=JOBS.find(x=>x._docId===docId); j.price=document.getElementById('p-'+docId).value; j.status=document.getElementById('s-'+docId).value; j.adminMessage=document.getElementById('m-'+docId).value; j.revisionNote=document.getElementById('r-'+docId).value; if(j.revisionNote.trim()!=='') j.status='Revision Needed'; try{await updateDoc(doc(db,'jobs',docId),{price:j.price,status:j.status,adminMessage:j.adminMessage,revisionNote:j.revisionNote,steps:defaultStepsJob(j)});}catch(e){alert(e.message)} renderStats(); render(); }
window.waJob=docId=>{let j=JOBS.find(x=>x._docId===docId); let msg=`Hello ${j.clientName||j.name}, ${j._showId} is ${j.status}. Price KSH ${j.price}. ${j.adminMessage}`; window.open('https://wa.me/'+(j.clientPhone||j.phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg))}
window.updateJobStep=async(docId,i)=>{ let j=JOBS.find(x=>x._docId===docId); if(!j.steps) j.steps=defaultStepsJob(j); j.steps[i].status=j.steps[i].status==='done'?'pending':'done'; j.steps[i].time=new Date().toLocaleString(); j.status=j.steps[i].name; try{await updateDoc(doc(db,'jobs',docId),{steps:j.steps,status:j.status});}catch{} render(); }
window.markNextJob=async docId=>{ let j=JOBS.find(x=>x._docId===docId); let steps=defaultStepsJob(j); let idx=steps.findIndex(s=>s.status!=='done'); if(idx===-1) return alert('All done'); await updateJobStep(docId,idx); }
window.saveTicket=async docId=>{ let t=TICKETS.find(x=>x._docId===docId); t.adminReply=document.getElementById('tr-'+docId).value; t.status=document.getElementById('ts-'+docId).value; if(!t.steps) t.steps=defaultStepsTic(t); try{await updateDoc(doc(db,'tickets',docId),{adminReply:t.adminReply,status:t.status,steps:t.steps});}catch{} render(); }
window.updateTicStep=async(docId,i)=>{ let t=TICKETS.find(x=>x._docId===docId); if(!t.steps) t.steps=defaultStepsTic(t); t.steps[i].status=t.steps[i].status==='done'?'pending':'done'; t.steps[i].time=new Date().toLocaleString(); t.status=t.steps[i].name; try{await updateDoc(doc(db,'tickets',docId),{steps:t.steps,status:t.status});}catch{} render(); }
window.markNextTic=async docId=>{ let t=TICKETS.find(x=>x._docId===docId); let steps=defaultStepsTic(t); let idx=steps.findIndex(s=>s.status!=='done'); if(idx===-1) return alert('All done'); await updateTicStep(docId,idx); }
window.updateLaundryStep=async(docId, stepIdx)=>{ let l=LAUNDRY.find(x=>x._docId===docId); if(!l.steps) l.steps=defaultStepsLaund(l); let wasDone = l.steps[stepIdx].status==='done'; l.steps[stepIdx].status= wasDone?'pending':'done'; l.steps[stepIdx].time=new Date().toLocaleString(); l.status=l.steps[stepIdx].name; if(l.status==='Ready for Pickup') l.status='Please Pay'; try{await updateDoc(doc(db,'laundry',docId),{steps:l.steps,status:l.status});}catch(e){alert(e.message)} }
window.confirmPayment=async(docId)=>{ let l=LAUNDRY.find(x=>x._docId===docId); let code=l.mpesaCode||'NO CODE'; if(!confirm(`Verify & Confirm ${code} for ${l._showId} KES ${l.mpesaAmount||l.total}? Till 1741514`)) return; await updateDoc(doc(db,'laundry',docId),{paid:true,paymentStatus:'PAID Till 1741514',status:'Payment Confirmed',paidAt:new Date().toLocaleString(),steps:defaultStepsLaund({...l,status:'Payment Confirmed'})}); }
window.noteSchedule=async(docId)=>{ let comment=document.getElementById('ac-'+docId).value; await updateDoc(doc(db,'laundry',docId),{scheduleNoted:true,adminComment:comment,scheduleNotedAt:new Date().toLocaleString()}); alert('Noted + Comment saved'); }
window.saveAdminComment=async(docId)=>{ let comment=document.getElementById('ac-'+docId).value; await updateDoc(doc(db,'laundry',docId),{adminComment:comment}); }
window.requestDispatchToRider=async(docId)=>{ await updateDoc(doc(db,'laundry',docId),{status:'Request Dispatch',steps:defaultStepsLaund({status:'Request Dispatch'})}); }
window.tickDelivered=async(docId)=>{ await updateDoc(doc(db,'laundry',docId),{status:'Delivered',deliveredAt:new Date().toLocaleString(),steps:defaultStepsLaund({status:'Delivered'})}); }
window.markNextStep=async docId=>{ let l=LAUNDRY.find(x=>x._docId===docId); let steps=defaultStepsLaund(l); let idx=steps.findIndex(s=>s.status!=='done'); if(idx===-1) return alert('All Delivered'); await updateLaundryStep(docId, idx); }
window.dispatchWithRider=async docId=>{ let rn=document.getElementById('rn-'+docId).value, rt=document.getElementById('rt-'+docId).value, rp=document.getElementById('rp-'+docId).value, sg=document.getElementById('sg-'+docId).value, ct=document.getElementById('ct-'+docId).value, eta=document.getElementById('eta-'+docId).value; let rcp=document.getElementById('rcp-'+docId).value || `RCP-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(1000+Math.random()*9000)}`; let comment=document.getElementById('ac-'+docId).value; if(!rn||!rt||!rp) return alert('Fill Rider Name, Tel, Bike No'); try{await updateDoc(doc(db,'laundry',docId),{riderName:rn,riderTel:rt,riderPlate:rp,bikeNumber:rp,signature:sg,closeTime:ct,eta:eta,receiptNo:rcp,adminComment:comment,status:'Out for Delivery',steps:defaultStepsLaund({status:'Out for Delivery'})}); alert('Dispatched '+rcp+' Rider '+rn);}catch(e){alert(e.message)} }
window.waLaundry=docId=>{let l=LAUNDRY.find(x=>x._docId===docId); let msg=`Hi ${l.name}, Laundry ${l._showId} is ${l.status}. ${l.mpesaCode?'Code '+l.mpesaCode:''} RCP ${l.receiptNo||''}. ${l.adminComment?'Admin: '+l.adminComment:''} Track: track.html?laundry=${l._showId}`; window.open('https://wa.me/'+(l.phone||'').replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg))}
async function confirmDelete(msg){ let p=prompt(msg+'\nType password to confirm DELETE:'); if(!(await hashCheck(p))) {alert('Wrong password — cancelled'); return false;} return true; }
window.delJob=async docId=>{ if(!(await confirmDelete('DELETE JOB '+docId+'?'))) return; try{await deleteDoc(doc(db,'jobs',docId));}catch{} JOBS=JOBS.filter(x=>x._docId!==docId); renderStats(); render(); }
window.delTicket=async docId=>{ if(!(await confirmDelete('DELETE TICKET '+docId+'?'))) return; try{await deleteDoc(doc(db,'tickets',docId));}catch{} TICKETS=TICKETS.filter(x=>x._docId!==docId); render(); }
window.delLaundry=async docId=>{ if(!(await confirmDelete('DELETE LAUNDRY '+docId+' PERMANENTLY?'))) return; try{await deleteDoc(doc(db,'laundry',docId));}catch{} LAUNDRY=LAUNDRY.filter(x=>x._docId!==docId); renderStats(); render(); }
window.render=()=>{
 let qv=(q.value||'').toLowerCase(), fs=fStat.value, html='';
 if(TAB==='jobs'){
  let list=[...JOBS]; if(qv) list=list.filter(j=>JSON.stringify(j).toLowerCase().includes(qv)); if(fs) list=list.filter(j=>j.status===fs||j.steps?.some(s=>s.name===fs&&s.status==='done'));
  if(!list.length) html=`<div class=card>No jobs</div>`;
  list.forEach(j=>{
   let steps=defaultStepsJob(j); let btns=steps.map((s,i)=>`<button class="stepBtn ${s.status==='done'?'done':''}" onclick="updateJobStep('${j._docId}',${i})">${s.status==='done'?'✅':'○'} ${s.name}</button>`).join(' ');
   html+=`<div class=card><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><span class=kbd>${j._showId}</span> <span class=badge style="background:#334155;color:#fff">${j.status||'Logged'}</span><br><b>${j.fullService||j.title||''}</b><br><span style="font-size:12px">${j.clientName||j.name||''} • ${j.clientPhone||j.phone||''}</span></div><div style="font-size:18px;font-weight:900;color:var(--gold)">${j.price?'KSH '+j.price:'Pending'}</div></div><div style="margin:10px 0"><b style="font-size:11px;color:var(--gold)">STEPS:</b><br><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${btns}</div></div><div class=grid2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label style="font-size:10px;color:var(--gold)">PRICE</label><input id="p-${j._docId}" class=input value="${j.price||''}"></div><div><label style="font-size:10px;color:var(--gold)">STATUS</label><select id="s-${j._docId}" class=select><option ${j.status==='Logged'?'selected':''}>Logged</option><option ${j.status==='Quoted'?'selected':''}>Quoted</option><option ${j.status==='Paid'?'selected':''}>Paid</option><option ${j.status==='In Progress'?'selected':''}>In Progress</option><option ${j.status==='Done'?'selected':''}>Done</option><option ${j.status==='Revision Needed'?'selected':''}>Revision Needed</option></select></div></div><div><label style="font-size:10px;color:var(--green)">ADMIN MESSAGE</label><textarea id="m-${j._docId}" class=textarea rows=2>${j.adminMessage||''}</textarea><label style="font-size:10px;color:var(--red)">RED LOCK</label><textarea id="r-${j._docId}" class=textarea rows=2>${j.revisionNote||''}</textarea></div></div>${starsHtml(j)}<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn gold" onclick="saveJob('${j._docId}')">💾 Save</button><button class="btn gold" onclick="markNextJob('${j._docId}')">⏭ Next Step</button><button class="btn line" onclick="waJob('${j._docId}')">WhatsApp</button><a class="btn line" href="track.html?job=${j._showId}" target="_blank">View</a><button class="btn red" onclick="delJob('${j._docId}')">🗑 DELETE</button></div></div>`;
  });
 }
 if(TAB==='tickets'){
  let list=[...TICKETS]; if(qv) list=list.filter(t=>JSON.stringify(t).toLowerCase().includes(qv)); if(fs) list=list.filter(t=>t.status===fs);
  if(!list.length) html=`<div class=card>No tickets</div>`;
  list.forEach(t=>{
   let steps=defaultStepsTic(t); let btns=steps.map((s,i)=>`<button class="stepBtn ${s.status==='done'?'done':''}" onclick="updateTicStep('${t._docId}',${i})">${s.status==='done'?'✅':'○'} ${s.name}</button>`).join(' ');
   html+=`<div class=card><div><span class=kbd style="color:#60a5fa">${t._showId}</span> for <b style="color:var(--gold)">${t.jobId||t._showId||''}</b> <span class=badge style="background:#334155;color:#fff">${t.status||'Open'}</span></div><b>${t.subject||''}</b><div class="well y">${t.message||''}</div><div style="margin:8px 0"><div style="display:flex;gap:6px;flex-wrap:wrap">${btns}</div></div>${t.adminReply?`<div class="well g">${t.adminReply}</div>`:''}${starsHtml(t)}<textarea id="tr-${t._docId}" class=textarea rows=2>${t.adminReply||''}</textarea><select id="ts-${t._docId}" class=select><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Closed'?'selected':''}>Closed</option></select><div style="display:flex;gap:8px;margin-top:8px"><button class="btn gold" onclick="saveTicket('${t._docId}')">💾 Reply</button><button class="btn gold" onclick="markNextTic('${t._docId}')">⏭ Next</button><button class="btn red" onclick="delTicket('${t._docId}')">🗑 DELETE</button></div></div>`;
  });
 }
 if(TAB==='laundry'){
  let list=[...LAUNDRY]; if(qv) list=list.filter(l=>JSON.stringify(l).toLowerCase().includes(qv)); if(fs) list=list.filter(l=> (l.status||'').toLowerCase()===fs.toLowerCase() || l.steps?.some(s=>s.name.toLowerCase()===fs.toLowerCase() && s.status==='done'));
  if(!list.length) html=`<div class=card>No laundry</div>`;
  list.forEach(l=>{
   let steps=defaultStepsLaund(l); let btns=steps.map((s,i)=>`<button class="stepBtn ${s.status==='done'?'done':''}" onclick="updateLaundryStep('${l._docId}', ${i})">${s.status==='done'?'✅':'○'} ${s.name}</button>`).join(' ');
   let payBadge = l.paymentStatus==='VERIFYING'? `<div class="well y" style="border-width:2px"><b>💰 CODE VISIBLE — VERIFY IN TILL 1741514</b><br>Code: <b style="color:#facc15;font-size:16px">${l.mpesaCode||''}</b> Amount: <b>${l.mpesaAmount||l.total}</b><br><button class="btn gold" style="margin-top:8px" onclick="confirmPayment('${l._docId}')">✅ VERIFY & CONFIRM PAYMENT</button></div>` : l.paid || l.paymentStatus?.includes('PAID')? `<span class=badge style="background:#052e16;color:#22c55e">✅ PAID Till 1741514 ${l.mpesaCode||''} ${l.mpesaAmount||''}</span>` : `<span class=badge style="background:#450a0a;color:#ef4444">NOT PAID</span> ${l.paymentStatus?`<span class=badge style="background:#422006;color:var(--gold)">${l.paymentStatus}</span>`:''}`;
   let dispatchInfo = (l.deliveryDate||l.deliveryPlace||l.deliveryChoice)? `<div class="well b"><b>🚚 DISPATCH REQUEST FROM USER:</b><br>Choice: <b style="color:#facc15">${l.deliveryChoice||''}</b><br>Date: ${l.deliveryDate||''} Time: ${l.deliveryTime||''} Place: <b>${l.deliveryPlace||''}</b><br>${l.customerNote?`Note: ${l.customerNote}<br>`:''}Status: ${l.deliveryStatus||''} ${l.scheduleNoted?'<b style="color:#22c55e">✓ Noted</b>':`<b style="color:#ef4444">⏳ Not Noted</b>`}<br><textarea id="ac-${l._docId}" class=textarea placeholder="Admin Comment e.g Sawa we dispatch tomorrow 3PM" style="margin-top:6px">${l.adminComment||''}</textarea><div style="display:flex;gap:6px;margin-top:6px"><button class="btn gold" onclick="noteSchedule('${l._docId}')">💬 Save Comment + Noted</button><button class="btn line" onclick="saveAdminComment('${l._docId}')">Save Comment Only</button></div></div>` : `<div class="well y"><b>No dispatch request yet</b><br>Waiting user to say OK or Please Not Now after Payment Confirmed<br><textarea id="ac-${l._docId}" class=textarea placeholder="Admin Comment" >${l.adminComment||''}</textarea></div>`;
   let receivedBadge = l.customerReceived? `<div class="well g">✅ Customer Clicked Received at ${l.customerReceivedAt||''} <button class="btn gold" onclick="tickDelivered('${l._docId}')">Tick Delivered</button></div>` : l.status==='Out for Delivery'||l.status==='Dispatched'? `<div class="well y">⏳ Waiting Customer Received click</div>`:'';
   html+=`<div class=card style="border-left:4px solid var(--gold)"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><span class=kbd>${l._showId}</span> <span class=badge style="background:#422006;color:var(--gold)">${l.status||'Received'}</span> ${l.paid?'':payBadge}<br><b>${l.service||''}</b> • KES ${l.total||0}<br><span style="font-size:12px">${l.name||''} • ${l.phone||''} • ${l.location||''}</span><br><span style="font-size:12px;color:var(--gold)">🚚 ${l.delivery||''} • RCP ${l.receiptNo||'pending'}</span></div><div style="font-size:11px;color:#94a3b8">${l.createdAt||''} ${l.mpesaCode?`<br>Code: ${l.mpesaCode} ${l.mpesaAmount||''}`:''}</div></div>
   ${l.paymentStatus==='VERIFYING'?'':payBadge}
   ${dispatchInfo}
   ${receivedBadge}
   <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px"><input id="rn-${l._docId}" class=input placeholder="Rider Name e.g John" value="${l.riderName||''}"><input id="rt-${l._docId}" class=input placeholder="Rider Tel e.g 07..." value="${l.riderTel||''}"><input id="rp-${l._docId}" class=input placeholder="Bike No / Plate e.g KM..." value="${l.riderPlate||l.bikeNumber||''}"><input id="sg-${l._docId}" class=input placeholder="Signature" value="${l.signature||''}"><input id="ct-${l._docId}" class=input placeholder="Close Time" value="${l.closeTime||''}"><input id="eta-${l._docId}" class=input placeholder="ETA e.g 30 mins" value="${l.eta||''}"><input id="rcp-${l._docId}" class=input placeholder="RCP- UNIQUE" value="${l.receiptNo||''}"></div>
   <div style="margin:12px 0"><b style="font-size:11px;color:var(--gold)">STEPS — Ready → Please Pay → Verify → Request Dispatch → Rider → Delivered:</b><br><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${btns}</div></div>${starsHtml(l)}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn gold" onclick="markNextStep('${l._docId}')">⏭ Next Step</button><button class="btn gold" style="background:#22c55e" onclick="dispatchWithRider('${l._docId}')">🚚 Dispatch + Rider Name Tel Bike + RCP</button><a class="btn line" href="track.html?laundry=${l._showId}" target="_blank">View Client Track</a><button class="btn line" onclick="waLaundry('${l._docId}')">WhatsApp Client</button><button class="btn red" onclick="delLaundry('${l._docId}')">🗑 DELETE LDY</button></div></div>`;
  });
 }
 if(TAB==='pillars'){ let pillars={}; JOBS.forEach(j=>{let p=j.pillar||'Unknown'; pillars[p]=(pillars[p]||0)+1}); html+=`<div class=card><h3 style="color:var(--gold)">7 Pillars + Laundry</h3>`+Object.entries(pillars).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155"><span>${k}</span><b style="color:var(--gold)">${v}</b></div>`).join('')+`<div style="display:flex;justify-content:space-between;padding:8px 0"><span>Laundry</span><b style="color:var(--gold)">${LAUNDRY.length}</b></div></div>`; }
 document.getElementById('list').innerHTML=html;
}
</script>
</body></html>
